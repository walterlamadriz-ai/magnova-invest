    '<div style="display:flex;align-items:center;margin-bottom:8px">'+
    '<span style="font-size:9px;font-family:\'JetBrains Mono\',monospace;letter-spacing:1px;text-transform:uppercase;color:var(--text3)">Tickers del plan</span>'+
    pctWarning+importBtn+
    '</div>'+
    '<div style="display:flex;flex-wrap:wrap;align-items:center">'+
    tickerChips+addRow+
    '</div>'+
    '</div>'+
    '</div>'+

    (results&&results.length?'<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:10px;font-family:\'JetBrains Mono\',monospace;color:var(--text3);margin-bottom:6px">'+
      '<span><span style="color:var(--grn)">✓ verde</span> = precio ≤ SMA (tramo activo)</span>'+
      '<span><span style="color:var(--grn)">RSI 30-45</span> = zona de entrada favorable</span>'+

      '<div style="font-size:12px">Presiona <b>Calcular distribución</b> para analizar los tickers.</div>'+
      '</div>'))+

    '<div style="margin-top:20px;padding:12px 16px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;font-size:10px;font-family:\'JetBrains Mono\',monospace;color:var(--text3);line-height:1.8">'+
    '<b style="color:var(--text2)">⚠ Guía educativa de distribución de capital.</b> '+

// ── REBALANCING TOOL ─────────────────────────────────────────────
var REBAL={targets:{}};

function renderRebal(){
  var plan=planOf();if(plan.locked&&plan.locked.indexOf('rebal')>=0){document.getElementById('main').innerHTML=lockedBanner('Rebalanceo','Mantén tu portafolio alineado con tus objetivos de asignación de activos.');return;}
  var port=S.portfolio;
  var totM=port.reduce(function(s,h){return s+h.sh*(getLivePrice(h.t)||h.cur||0);},0);

  port.forEach(function(h){
    if(REBAL.targets[h.t]===undefined){
      REBAL.targets[h.t]=Math.round(h.sh*(getLivePrice(h.t)||h.cur||0)/(totM||1)*100);
    }
  });

  var sumTargets=Object.values(REBAL.targets).reduce(function(s,v){return s+v;},0);
  var balanced=Math.abs(sumTargets-100)<1;

  var sliders=port.map(function(h){
    var cur=getLivePrice(h.t)||h.cur||0;
    var curW=h.sh*cur/(totM||1)*100;
    var tgt=REBAL.targets[h.t]||0;
    var diff=tgt-curW;
    return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">'+
      '<span style="font-size:12px;font-weight:700;color:var(--bright);font-family:\'JetBrains Mono\',monospace;width:52px">'+h.t+'</span>'+
      '<span style="font-size:10px;color:var(--text3);font-family:\'JetBrains Mono\',monospace;width:36px">'+curW.toFixed(1)+'%</span>'+
      '<input type="range" min="0" max="60" step="1" value="'+tgt+'" style="flex:1;accent-color:var(--amber)" oninput="REBAL.targets[\''+h.t+'\']=parseInt(this.value);rebalUpdate()"/>'+
      '<span id="rebal-tgt-'+h.t+'" style="font-size:11px;font-weight:600;color:var(--amber);font-family:\'JetBrains Mono\',monospace;width:32px;text-align:right">'+tgt+'%</span>'+
      '<span style="font-size:11px;font-weight:600;width:60px;text-align:right;color:'+(Math.abs(diff)<0.5?'var(--text3)':diff>0?'var(--grn)':'var(--red)')+';font-family:\'JetBrains Mono\',monospace">'+
      (Math.abs(diff)<0.5?'—':(diff>0?'+':'')+diff.toFixed(1)+'%')+'</span></div>';
  }).join('');

  var trades=port.map(function(h){
    var cur=getLivePrice(h.t)||h.cur||0;
    var curVal=h.sh*cur;
    var tgtVal=totM*(REBAL.targets[h.t]||0)/100;
    var diff=tgtVal-curVal;
    if(Math.abs(diff)<10) return null;
    return{t:h.t,cur:cur,diff:diff,shares:diff/cur,buy:diff>0};
  }).filter(Boolean);

  var tradeRows=trades.map(function(tr){
    return '<tr style="background:'+(tr.buy?'rgba(34,197,94,.04)':'rgba(239,68,68,.04)')+'">'+
      '<td style="font-weight:700;color:var(--bright)">'+tr.t+'</td>'+
      '<td><span class="badge '+(tr.buy?'buy':'sell')+'">'+(tr.buy?'Aumentar':'Reducir')+'</span></td>'+
      '<td style="font-weight:600;color:'+(tr.buy?'var(--grn)':'var(--red)')+'">'+Math.abs(tr.shares).toFixed(4)+' acc.</td>'+
      '<td style="font-weight:600;color:'+(tr.buy?'var(--grn)':'var(--red)')+'">'+(tr.buy?'+':'-')+'$'+fmt(Math.abs(tr.diff))+'</td>'+
      '</tr>';
  }).join('');

  document.getElementById('main').innerHTML=
    '<div class="fos-module-header"><div><div class="fos-module-crumb">Seguimiento · Rebalanceo</div><div class="fos-module-title">Rebalanceo</div>'+
    '<div class="fos-module-sub">Define pesos objetivo · Calcula ajustes exactos</div></div>'+
    '<div class="ph-right">'+liveBadge()+'</div></div>'+
    '<div class="resp2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'+
    '<div class="cb">'+
    '<div class="st"><div class="stbar"></div>Pesos objetivo</div>'+
    sliders+
    '<div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:4px">'+
    '<span style="font-size:12px;color:var(--text2)">Suma total:</span>'+
    '<span id="rebal-sum" style="font-size:15px;font-weight:700;color:'+(balanced?'var(--grn)':'var(--red)')+';font-family:\'JetBrains Mono\',monospace">'+sumTargets+'%</span>'+
    '</div>'+
    (!balanced?'<div style="font-size:10px;color:var(--red);font-family:\'JetBrains Mono\',monospace;margin-top:4px">⚠ Los pesos deben sumar 100%</div>':'')+
    '<button onclick="rebalReset()" class="btn" style="margin-top:10px;width:100%">↺ Restaurar pesos actuales</button>'+
    '</div>'+
    '<div>'+
    '<div class="cb" style="margin-bottom:12px">'+
    '<div class="st"><div class="stbar"></div>Capital a rebalancear</div>'+
    '<div style="font-size:26px;font-weight:700;color:var(--bright);font-family:\'JetBrains Mono\',monospace">$'+fmt(totM)+'</div>'+
    '<div style="font-size:11px;color:var(--text3);font-family:\'JetBrains Mono\',monospace;margin-top:3px">'+port.length+' posiciones · Suma pesos: '+sumTargets+'%</div>'+
    '</div>'+
    (trades.length>0?
      '<div class="cb"><div class="st"><div class="stbar"></div>Ajustes de referencia para rebalancear</div>'+
      '<div class="tw"><table><thead><tr><th>Ticker</th><th>Ajuste</th><th>Cantidad</th><th>Monto USD</th></tr></thead><tbody>'+tradeRows+'</tbody></table></div>'+
      '<div style="font-size:9px;color:var(--text3);font-family:\'JetBrains Mono\',monospace;margin-top:8px;line-height:1.5">Ajustes referenciales para alinear pesos con tu objetivo. Análisis educativo — no constituye recomendación ni instrucción de inversión.</div></div>'
    :'<div class="cb"><div style="text-align:center;padding:24px;color:var(--text3)">'+
      '<div style="font-size:32px;margin-bottom:8px">✅</div>'+
      '<div style="font-size:12px;font-weight:600;color:var(--bright)">Portfolio balanceado</div>'+
      '<div style="font-size:10px;font-family:\'JetBrains Mono\',monospace;margin-top:4px">Ajusta los sliders para ver los cambios de peso</div></div></div>'
    )+
    '</div></div>';
}

function rebalUpdate(){
  var sumTargets=Object.values(REBAL.targets).reduce(function(s,v){return s+v;},0);
  var el=document.getElementById('rebal-sum');

  try{

  }).catch(function(){});

  // ③ Auto-refresh every 5 min (only when tab visible and during market hours)
  _bootInterval=setInterval(function(){
    if(!S.user){clearInterval(_bootInterval);_bootInterval=null;_bootRunning=false;return;}

// Read all consent records for the authenticated user from Supabase
async function readUserConsents(userId){
  try{
    var res=await sb.from('consents')
      .select('document_type,version')
      .eq('user_id',userId);
    if(res.error) throw res.error;
    return res.data||[];
  }catch(e){
    console.error('readUserConsents failed',e);
    return [];
  }
}

// Return which required consents are missing given the existing ones
function getMissingConsents(existing){
  var required=getRequiredConsents();
  return required.filter(function(req){
    return !existing.some(function(e){
      return e.document_type===req.document_type && e.version===req.version;
    });
  });
}

// Insert only the missing consents — no upsert, no update needed
async function recordUserConsents(userId,source){
  try{
    var existing=await readUserConsents(userId);
    var missing=getMissingConsents(existing);
    if(missing.length===0) return {ok:true,inserted:0};
    var ua=navigator.userAgent.slice(0,200);
    var rows=missing.map(function(c){
      return {
        user_id:      userId,
        document_type:c.document_type,
        version:      c.version,
        source:       source||'unknown',
        user_agent:   ua
      };
    });
    var res=await sb.from('consents').insert(rows);
    if(res.error) throw res.error;
    return {ok:true,inserted:rows.length};
  }catch(e){
    console.error('recordUserConsents failed',e);
    return {ok:false,error:e.message||'insert_failed'};
  }
}

function wv3CountUp(targetId, finalVal, delay){
  var el=document.getElementById(targetId);
  if(!el) return;

  // requestAnimationFrame no dispara en pestañas ocultas: si la pagina se abre
  // en segundo plano (cmd+click, sesion restaurada) el contador queda congelado
  // a mitad y muestra un numero falso (ej. 13 en lugar de 78). El valor mostrado
  // debe ser siempre el real, asi que sin animacion se escribe el final directo.
  var sinAnimacion = document.hidden ||
    (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if(sinAnimacion){ el.textContent = finalVal; return; }

  var dur=700, startTime=null, terminado=false;
  function finalizar(){
    if(terminado) return;
    terminado = true;
    el.textContent = finalVal;
    document.removeEventListener('visibilitychange', alOcultar);
  }
  function alOcultar(){ if(document.hidden) finalizar(); }
  document.addEventListener('visibilitychange', alOcultar);

  setTimeout(function(){
    if(terminado) return;
    requestAnimationFrame(function tick(ts){
      if(terminado) return;
      if(!startTime) startTime=ts;
      var p=Math.min(1,(ts-startTime)/dur);
      var eased=1-Math.pow(1-p,3);
      el.textContent=Math.round(finalVal*eased);
      if(p<1) requestAnimationFrame(tick); else finalizar();
    });
  }, delay);
}

  if(el){el.classList.add("show");setTimeout(function(){el.classList.remove("show");},1400);}
  if(!S.user||!S.user.id) return;
  if(_persistTimer) clearTimeout(_persistTimer);
  _persistTimer=setTimeout(function(){
    sb.from("profiles").update({capital:S.capital}).eq("id",S.user.id).then(function(){},function(e){console.error("persist capital failed",e);});
  },600);
}

// ── PORTFOLIO CRUD (Supabase-backed) ─────────────────────────────
async function sbAddHolding(h){
  if(!S.user||!S.user.id) return h.id;
  var res=await sb.from("portfolio_holdings").insert({
    user_id:S.user.id, ticker:h.t, asset_type:h.type, shares:h.sh, avg_cost:h.cost, note:h.note||""
  }).select().single();
  if(res.error){ console.error("sbAddHolding failed",res.error); return null; }
  return res.data.id;
}
async function sbUpdateHolding(h){
  if(!S.user||!S.user.id) return;
  var res=await sb.from("portfolio_holdings").update({
    ticker:h.t, asset_type:h.type, shares:h.sh, avg_cost:h.cost, note:h.note||""
  }).eq("id",h.id).eq("user_id",S.user.id);
  if(res.error) console.error("sbUpdateHolding failed",res.error);
}
async function sbDeleteHolding(id){
  if(!S.user||!S.user.id) return;
  var res=await sb.from("portfolio_holdings").delete().eq("id",id).eq("user_id",S.user.id);
  if(res.error) console.error("sbDeleteHolding failed",res.error);
}
async function sbAddWatch(ticker){
  if(!S.user||!S.user.id) return;
  var res=await sb.from("watchlist").insert({user_id:S.user.id, ticker:ticker});
  if(res.error) console.error("sbAddWatch failed",res.error);
}
async function sbRmWatch(ticker){
  if(!S.user||!S.user.id) return;
  var res=await sb.from("watchlist").delete().eq("user_id",S.user.id).eq("ticker",ticker);
  if(res.error) console.error("sbRmWatch failed",res.error);
}

// ── STARTUP ──────────────────────────────────────────────────
initTheme();
radarInit();
radarCheckSharedLink();
renderDisclaimer();

(async function boot(){
  document.getElementById('main').innerHTML='<div class="dload"><div class="spin"></div>Cargando FinanceOS Invest...</div>';
  try{
    var sess=await sb.auth.getSession();
    if(sess.data.session&&sess.data.session.user){
      await sbLoadUserData(sess.data.session.user);
    }
  }catch(e){ console.error("boot session check failed",e); }
  render();
  if(S.user) bootLiveData(); // arranca carga de precios live (portfolio/watchlist/señales)

  // ── Retorno post-pago de Stripe ──
  try{
    var qp=new URLSearchParams(window.location.search);
    if(qp.get('upgraded')==='1'){
      track('upgrade_success');
      if(typeof showToast==='function') showToast('¡Bienvenido a Pro! 🎉 Tu suscripción está activa.','success');
      // El webhook actualiza el plan en Supabase; recargar datos por si hubo demora
      try{ var s2=await sb.auth.getSession(); if(s2.data.session&&s2.data.session.user){ await sbLoadUserData(s2.data.session.user); render(); } }catch(e){}
      history.replaceState({}, '', '/app'); // limpia el query param
    } else if(qp.get('upgrade_cancelled')==='1'){
      track('upgrade_cancelled');
      history.replaceState({}, '', '/app');
    }
  }catch(e){}
})();

sb.auth.onAuthStateChange(function(event,session){
  if(event==="SIGNED_OUT"){
    S.user=null;S.page="news";
    render();
  } else if(event==="SIGNED_IN"&&session&&session.user){
    sbLoadUserData(session.user).then(function(){ render(); bootLiveData(); });
  }
});



</script>
