<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MAGNOVA Invest — by MAXNOVA & LUCI Global LLC</title>
<meta name="description" content="Plataforma de análisis de inversiones para LATAM. Portfolio, señales técnicas, gestión de riesgo y contexto macro."/>
<style>
/* ═══════════════════════════════════════════════════════════════════
   MAGNOVA INVEST — Sistema de diseño alineado con FinanceOS Pro
   MAXNOVA & LUCI Global LLC · v2.0
   Tipografía: Inter + JetBrains Mono
   Paleta: mismos tokens que FinanceOS globals.css
   ═══════════════════════════════════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

/* ── TOKENS ── */
:root {
  /* Colores — modo claro (idéntico a FinanceOS light) */
  --grn:       #1a6b4a;
  --grn-bg:    #e8f5ef;
  --grn-lt:    #d0eddf;
  --grn-d:     #145538;

  --red:       #c0392b;
  --red-bg:    #fdf0ee;
  --red-lt:    #f8d7d3;

  --amber:     #b45309;
  --amber-bg:  #fef3c7;

  --blue:      #1d4ed8;
  --blue-bg:   #eff6ff;

  /* Superficies */
  --bg:        #f7f8f9;
  --bg2:       #ffffff;
  --card:      #ffffff;
  --card2:     #f7f8f9;
  --card3:     #f0f1f3;
  --card4:     #e8eaed;

  /* Texto */
  --text:      #374151;
  --text2:     #6b7280;
  --text3:     #9ca3af;
  --bright:    #111827;
  --white:     #ffffff;

  /* Bordes — idéntico a FinanceOS (.07 / .13) */
  --border:    rgba(0,0,0,0.07);
  --border2:   rgba(0,0,0,0.11);
  --border3:   rgba(0,0,0,0.16);

  /* Sombras */
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.10), 0 4px 8px rgba(0,0,0,.05);

  /* Espaciado */
  --r-sm:  6px;
  --r-md:  10px;
  --r-lg:  14px;
  --r-xl:  20px;

  /* Sidebar */
  --sb-w:  220px;
}

/* ── DARK MODE ── */
[data-theme="dark"] {
  --grn:       #3dbe7a;
  --grn-bg:    #0f2218;
  --grn-lt:    #163d26;
  --grn-d:     #4fd48a;

  --red:       #e05a4a;
  --red-bg:    #2a120f;
  --red-lt:    #3d1a16;

  --amber:     #f59e0b;
  --amber-bg:  #2d1f05;

  --blue:      #60a5fa;
  --blue-bg:   #0f1f3d;

  --bg:        #0f1117;
  --bg2:       #161b24;
  --card:      #1a2030;
  --card2:     #1e2636;
  --card3:     #232c3d;
  --card4:     #2a3347;

  --text:      #9ca8bc;
  --text2:     #6b7a8f;
  --text3:     #475569;
  --bright:    #e2e8f0;
  --white:     #f1f5f9;

  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.11);
  --border3:   rgba(255,255,255,0.16);

  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.5);
}

/* ── RESET ── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { font-size:14px; -webkit-text-size-adjust:100%; }

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background .2s, color .2s;
}

/* ── LAYOUT ── */
.app { display:flex; min-height:100vh; }

/* ── SIDEBAR ── */
.sb {
  width: var(--sb-w);
  background: var(--card);
  border-right: 0.5px solid var(--border2);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 20px 16px 16px;
  border-bottom: 0.5px solid var(--border);
}
.logo-icon {
  width: 32px; height: 32px;
  background: var(--grn);
  border-radius: var(--r-sm);
  display: flex; align-items:center; justify-content:center;
  font-size: 11px; font-weight: 700;
  color: #fff;
  letter-spacing: .5px;
  flex-shrink: 0;
}
.logo-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--bright);
  letter-spacing: -.2px;
}
.logo-sub {
  font-size: 10px;
  color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 1px;
}

.sb-section { padding: 14px 8px 4px; }
.sb-section-label {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text3);
  padding: 0 8px;
  margin-bottom: 4px;
}

.sb-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border-radius: var(--r-sm);
  border: none;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  width: 100%;
  text-align: left;
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  transition: background .12s, color .12s;
  margin-bottom: 1px;
}
.sb-btn:hover { background: var(--card2); color: var(--bright); }
.sb-btn.active {
  background: var(--grn-bg);
  color: var(--grn);
}
.sb-btn .sb-icon {
  width: 16px; height: 16px;
  opacity: .7;
  flex-shrink: 0;
  font-size: 14px;
  display: flex; align-items:center; justify-content:center;
}
.sb-btn.active .sb-icon { opacity: 1; }

.sb-footer {
  margin-top: auto;
  padding: 12px;
  border-top: 0.5px solid var(--border);
}
.sb-user {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 6px;
  border-radius: var(--r-sm);
}
.sb-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--grn-bg);
  border: 1.5px solid var(--grn-lt);
  display: flex; align-items:center; justify-content:center;
  font-size: 11px; font-weight: 600;
  color: var(--grn);
  flex-shrink: 0;
}
.sb-user-name { font-size: 11px; font-weight: 600; color: var(--bright); }
.sb-user-plan {
  font-size: 9px;
  color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
}

/* ── MAIN CONTENT ── */
.main {
  margin-left: var(--sb-w);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── PAGE HEADER ── */
.ph {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 28px 18px;
  border-bottom: 0.5px solid var(--border);
  background: var(--card);
  gap: 16px;
  flex-wrap: wrap;
}
.ph h1 {
  font-size: 17px;
  font-weight: 600;
  color: var(--bright);
  letter-spacing: -.3px;
}
.sub-txt {
  font-size: 11px;
  color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 2px;
}
.ph-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* ── PAGE BODY ── */
.page-body {
  padding: 24px 28px;
  flex: 1;
}

/* ── KPI CARDS ── */
.krow {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}
.kpi {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
}
.kl {
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text3);
  margin-bottom: 6px;
}
.kv {
  font-size: 20px;
  font-weight: 600;
  color: var(--bright);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.5px;
}
.ks {
  font-size: 11px;
  margin-top: 3px;
  font-family: 'JetBrains Mono', monospace;
}
.ks.pos { color: var(--grn); }
.ks.neg { color: var(--red); }
.ks.neu { color: var(--text3); }

/* KPI color accents — borde izquierdo sutil */
.kg { border-left: 2px solid var(--grn); }
.kr { border-left: 2px solid var(--red); }
.ka { border-left: 2px solid var(--amber); }
.kb { border-left: 2px solid var(--blue); }

/* ── CARD BOX ── */
.cb {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
}

/* ── SECTION TITLE ── */
.st {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text3);
  margin-bottom: 14px;
}
.stbar {
  width: 3px; height: 12px;
  background: var(--grn);
  border-radius: 2px;
  flex-shrink: 0;
}

/* ── TABLE ── */
.tw {
  border: 0.5px solid var(--border2);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
}
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left;
  padding: 10px 14px;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text3);
  background: var(--card2);
  border-bottom: 0.5px solid var(--border2);
  white-space: nowrap;
}
td {
  padding: 9px 14px;
  font-size: 12px;
  border-bottom: 0.5px solid var(--border);
  font-variant-numeric: tabular-nums;
  color: var(--text);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
.trow:hover td { background: var(--card2); }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px;
  border-radius: var(--r-sm);
  border: 0.5px solid var(--border2);
  background: var(--card);
  color: var(--text2);
  font-size: 12px;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all .12s;
  white-space: nowrap;
}
.btn:hover {
  border-color: var(--grn);
  color: var(--grn);
  background: var(--grn-bg);
}
.btn-big {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border-radius: var(--r-sm);
  border: none;
  background: var(--grn);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: background .12s, transform .1s;
  white-space: nowrap;
}
.btn-big:hover { background: var(--grn-d); transform: translateY(-1px); }
.btn-big:active { transform: translateY(0); }
.btn-big:disabled { opacity:.5; cursor:not-allowed; transform:none; }

/* ── INPUTS ── */
.inp {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-sm);
  padding: 7px 10px;
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  color: var(--bright);
  outline: none;
  transition: border-color .12s;
  width: 100%;
}
.inp:focus { border-color: var(--grn); box-shadow: 0 0 0 3px var(--grn-bg); }

/* ── BADGES ── */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .3px;
  font-family: 'JetBrains Mono', monospace;
}
.badge.buy  { background: var(--grn-bg); color: var(--grn); }
.badge.hold { background: var(--amber-bg); color: var(--amber); }
.badge.sell { background: var(--red-bg); color: var(--red); }

/* ── LIVE BADGE ── */
.live-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 500;
  font-family: 'JetBrains Mono', monospace;
  background: var(--grn-bg);
  color: var(--grn);
  border: 0.5px solid var(--grn-lt);
}
.live-badge.loading { background: var(--amber-bg); color: var(--amber); border-color: #fde68a; }
.live-badge.error   { background: var(--red-bg);   color: var(--red);   border-color: var(--red-lt); }
.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse-dot 2s ease infinite;
}
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── SCORE BAR ── */
.score-bar {
  height: 3px;
  background: var(--card3);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}
.score-fill {
  height: 100%;
  border-radius: 2px;
  transition: width .4s ease;
}
.score-fill.high { background: var(--grn); }
.score-fill.mid  { background: var(--amber); }
.score-fill.low  { background: var(--red); }

/* ── TABS ── */
.tabs {
  display: flex;
  gap: 2px;
  margin-bottom: 18px;
  border-bottom: 0.5px solid var(--border2);
}
.tab-btn {
  padding: 8px 14px;
  border: none;
  background: transparent;
  color: var(--text3);
  font-size: 12px;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -0.5px;
  transition: color .12s, border-color .12s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.act {
  color: var(--grn);
  border-bottom-color: var(--grn);
}

/* ── MODAL / OVERLAY ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  padding: 20px;
  backdrop-filter: blur(4px);
}
.modal {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-xl);
  padding: 28px;
  max-width: 480px;
  width: 100%;
  box-shadow: var(--shadow-lg);
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}
.modal h2 {
  font-size: 17px;
  font-weight: 600;
  color: var(--bright);
  margin-bottom: 6px;
  letter-spacing: -.3px;
}
.modal .modal-sub {
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 22px;
  line-height: 1.5;
}
.modal-close {
  position: absolute;
  top: 16px; right: 16px;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 0.5px solid var(--border2);
  background: var(--card2);
  color: var(--text2);
  cursor: pointer;
  display: flex; align-items:center; justify-content:center;
  font-size: 14px;
  transition: background .12s;
}
.modal-close:hover { background: var(--red-bg); color: var(--red); }

/* ── DRAWER ── */
.dov {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.2);
  z-index: 200;
  backdrop-filter: blur(2px);
}
.drw {
  position: fixed;
  top: 0; right: -420px;
  width: 400px;
  height: 100vh;
  background: var(--card);
  border-left: 0.5px solid var(--border2);
  z-index: 201;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
  transition: right .25s cubic-bezier(.4,0,.2,1);
  overflow: hidden;
}
.drw.open { right: 0; }
.drw.open ~ .dov { display: block; }
.drwh {
  padding: 18px 20px;
  border-bottom: 0.5px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.drwb {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px;
}

/* ── SPINNER ── */
.spin {
  width: 20px; height: 20px;
  border: 2px solid var(--border2);
  border-top-color: var(--grn);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
.spin-sm {
  width: 12px; height: 12px;
  border-width: 1.5px;
  border: 1.5px solid var(--border2);
  border-top-color: var(--grn);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── SKELETON LOADER ── */
.skel {
  background: linear-gradient(90deg, var(--card3) 25%, var(--card4) 50%, var(--card3) 75%);
  background-size: 200% 100%;
  animation: skel-load 1.4s ease infinite;
  border-radius: 4px;
}
@keyframes skel-load { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
@keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.9} }

/* ── GRID LAYOUTS ── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.g-sidebar { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
.dload {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 40px;
  color: var(--text3); font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
}

/* ── DISCLAIMER LEGAL ── */
.disclaimer-bar {
  background: var(--amber-bg);
  border-top: 0.5px solid rgba(180,83,9,.15);
  padding: 8px 28px;
  font-size: 10px;
  color: var(--amber);
  font-family: 'JetBrains Mono', monospace;
  line-height: 1.5;
  flex-shrink: 0;
}

/* ── WELCOME / LOGIN ── */
.welcome-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  padding: 24px;
}
.welcome-box {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-xl);
  padding: 40px 36px;
  max-width: 380px;
  width: 100%;
  box-shadow: var(--shadow-md);
}
.welcome-logo {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 28px;
}
.welcome-icon {
  width: 36px; height: 36px;
  background: var(--grn);
  border-radius: var(--r-sm);
  display: flex; align-items:center; justify-content:center;
  font-size: 13px; font-weight: 700;
  color: #fff;
}
.welcome-title {
  font-size: 17px; font-weight: 600;
  color: var(--bright); letter-spacing: -.3px;
}
.welcome-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }

.form-label {
  display: block;
  font-size: 11px; font-weight: 500;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: .6px;
  margin-bottom: 6px;
}
.form-group { margin-bottom: 14px; }
.form-error {
  font-size: 11px; color: var(--red);
  margin-top: 6px;
  font-family: 'JetBrains Mono', monospace;
  display: none;
}

/* ── DARK MODE TOGGLE ── */
.theme-toggle {
  width: 32px; height: 18px;
  border-radius: 9px;
  background: var(--border2);
  border: none; cursor: pointer;
  position: relative;
  transition: background .2s;
  flex-shrink: 0;
}
.theme-toggle.on { background: var(--grn); }
.theme-toggle::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #fff;
  transition: transform .2s;
  box-shadow: var(--shadow-sm);
}
.theme-toggle.on::after { transform: translateX(14px); }

/* ── UPGRADE PLAN BADGE ── */
.plan-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 9px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.plan-free  { background: var(--card3); color: var(--text2); }
.plan-trial { background: var(--amber-bg); color: var(--amber); }
.plan-pro   { background: var(--grn-bg); color: var(--grn); }
.plan-teams { background: var(--blue-bg); color: var(--blue); }

/* ── PAYWALL ── */
.paywall {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 400px; text-align: center;

function proxyUrl(url){

}
function proxyUrl2(url){
  return "https://api.allorigins.win/raw?url="+encodeURIComponent(url);
}

var fetchStats={ok:0,fail:0,lastErr:null,lastOk:null};

function fetchWithTimeout(url,ms){
  ms=ms||7000;
  return new Promise(function(resolve,reject){
    var ctrl=new AbortController();
    var timer=setTimeout(function(){ctrl.abort();reject(new Error('Timeout'));},ms);
    fetch(url,{signal:ctrl.signal}).then(function(r){
      clearTimeout(timer);resolve(r);
    }).catch(function(e){clearTimeout(timer);reject(e);});
  });
}

async function fetchYF(url){
  var isVercel=window.location.hostname.includes('vercel.app')||
               window.location.hostname.includes('magnova.app')||
               window.location.hostname.includes('magnova-invest');

  // On Vercel: use our Edge Function proxy (fast, no CORS)
  if(isVercel){
    var tm=url.match(/chart\/([^?/]+)/);
    if(tm){
      try{
        var apiRes=await fetchWithTimeout('/api/quote?ticker='+encodeURIComponent(tm[1]),4000);
        if(apiRes.ok){
          var apiData=await apiRes.json();
          var t=tm[1].toUpperCase();
          if(apiData[t]){
            var q=apiData[t];
            fetchStats.ok++;fetchStats.lastOk=Date.now();
            // Return Yahoo-compatible format
            return {chart:{result:[{meta:{
              regularMarketPrice:q.price,previousClose:q.prevClose,
              regularMarketVolume:q.volume,fiftyTwoWeekHigh:q.high52,
              fiftyTwoWeekLow:q.low52,marketCap:q.marketCap,currency:q.currency,
            },timestamps:[],indicators:{quote:[{close:[],open:[],high:[],low:[],volume:[]}]}}]}};
          }
        }
      }catch(e){fetchStats.fail++;fetchStats.lastErr=e.message;}
    }
  }

  // Fallback: public proxies (local dev or Edge Function unavailable)
  var proxies=[proxyUrl(url),proxyUrl2(url)];
  for(var i=0;i<proxies.length;i++){
    try{
      var res=await fetchWithTimeout(proxies[i],4000);
      if(!res.ok) throw new Error("HTTP "+res.status);
      var text=await res.text();
      if(!text||text.length<10) throw new Error("Empty");
      var json=JSON.parse(text);
      fetchStats.ok++;fetchStats.lastErr=null;fetchStats.lastOk=Date.now();
      return json;
    }catch(e){
      fetchStats.fail++;fetchStats.lastErr=e.message;
      if(i<proxies.length-1) await new Promise(function(r){setTimeout(r,300);});
    }
  }
  return null;
}
async function fetchQuote(ticker){
  try{
    var url="https://query1.finance.yahoo.com/v8/finance/chart/"+ticker+"?interval=1d&range=1d&includePrePost=false&events=&indicators=quote";
    var json=await fetchYF(url);
    if(!json) return null;
    var m=json.chart&&json.chart.result&&json.chart.result[0]&&json.chart.result[0].meta;
    if(!m||!m.regularMarketPrice) return null;
    var price=m.regularMarketPrice;
    var prev=m.previousClose||price;
    return {
      ticker:ticker,price:price,prevClose:prev,
      change:price-prev,changePct:prev?(price-prev)/prev:0,
      volume:m.regularMarketVolume||0,marketCap:m.marketCap||0,
      high52:m.fiftyTwoWeekHigh||price*1.2,
      low52:m.fiftyTwoWeekLow||price*0.8,
      exchange:m.exchangeName||"NASDAQ",
      marketState:m.marketState||"REGULAR"
    };
  }catch(e){return null;}
}
async function fetchHistory(ticker,range){
  try{
    var r=range||"3mo";
    var url="https://query1.finance.yahoo.com/v8/finance/chart/"+ticker+"?interval=1d&range="+r+"&includePrePost=false";
    var json=await fetchYF(url);
    if(!json) return null;
    var res=json.chart&&json.chart.result&&json.chart.result[0];
    if(!res||!res.timestamp) return null;
    var ts=res.timestamp;
    var q=res.indicators&&res.indicators.quote&&res.indicators.quote[0];
    if(!ts||!q) return null;
    var data=[];
    for(var i=0;i<ts.length;i++){
      if(q.close[i]!=null&&q.close[i]>0){
        data.push({
          date:new Date(ts[i]*1000).toLocaleDateString("es-CL",{month:"short",day:"numeric"}),
          open:q.open[i]||q.close[i],high:q.high[i]||q.close[i],
          low:q.low[i]||q.close[i],close:q.close[i],
          vol:q.volume[i]||0,p:i+1
        });
      }
    }
    return data.length>5?data:null;
  }catch(e){return null;}
}
async function fetchFundamentals(ticker){
  var url="https://query1.finance.yahoo.com/v10/finance/quoteSummary/"+ticker+"?modules=summaryDetail,defaultKeyStatistics,financialData";
  var json=await fetchYF(url);
  if(!json) return null;
  var s=json&&json.quoteSummary&&json.quoteSummary.result&&json.quoteSummary.result[0];
  if(!s) return null;
  return {
    peRatio:s.summaryDetail&&s.summaryDetail.trailingPE&&s.summaryDetail.trailingPE.raw,
    forwardPE:s.summaryDetail&&s.summaryDetail.forwardPE&&s.summaryDetail.forwardPE.raw,
    eps:s.defaultKeyStatistics&&s.defaultKeyStatistics.trailingEps&&s.defaultKeyStatistics.trailingEps.raw,
    roe:s.financialData&&s.financialData.returnOnEquity&&s.financialData.returnOnEquity.raw,

    dividendYield:s.summaryDetail&&s.summaryDetail.dividendYield&&s.summaryDetail.dividendYield.raw,
    priceToBook:s.defaultKeyStatistics&&s.defaultKeyStatistics.priceToBook&&s.defaultKeyStatistics.priceToBook.raw

}

async function refreshLive(tickers,manual){
  if(liveLoading&&!manual) return;
  liveLoading=true;
  liveFailed=false;
  // Spinner on all refresh buttons
  document.querySelectorAll('.refresh-btn').forEach(function(b){
    b.innerHTML='<span class="spin-sm"></span>';b.disabled=true;
  });
  try{
    var gotAny=false;
    var isVercel=window.location.hostname.includes('vercel.app')||
                 window.location.hostname.includes('magnova.app')||
                 window.location.hostname.includes('magnova-invest');

    if(isVercel){
      // ONE request for all tickers via our Edge Function
      try{
        var batchRes=await fetchWithTimeout('/api/quote?ticker='+tickers.join(','),6000);
        var batchData=await batchRes.json();
        Object.keys(batchData).forEach(function(t){
          var q=batchData[t];
          if(q&&q.price){
            LIVE[t]=q;
            S.portfolio.forEach(function(h){if(h.t===t)h.cur=q.price;});
            ALL_SIG.forEach(function(s){if(s.t===t)s.p=q.price;});
            gotAny=true;
          }
        });
        if(gotAny) updateLivePricesInDOM();
      }catch(e){/* fall through to individual fetches */}
    }

    if(!gotAny){
      // Fallback: individual fetches with batching
      var BATCH_SIZE=6;
      for(var bi=0;bi<tickers.length;bi+=BATCH_SIZE){
        var batch=tickers.slice(bi,bi+BATCH_SIZE);
        var results=await Promise.allSettled(batch.map(function(t){return fetchQuote(t);}));
        results.forEach(function(r,i){
          if(r.status==="fulfilled"&&r.value){
            var t=batch[i];
            LIVE[t]=r.value;
            S.portfolio.forEach(function(h){if(h.t===t)h.cur=r.value.price;});
            ALL_SIG.forEach(function(s){if(s.t===t)s.p=r.value.price;});
            gotAny=true;
          }
        });
        if(gotAny) updateLivePricesInDOM();
      }
    }
    if(gotAny){
      liveUpdated=Date.now();liveFailed=false;liveFromCache=false;
      try{localStorage.setItem('mv_prices_cache',JSON.stringify({ts:Date.now(),live:LIVE}));}catch(e){/* silent */}
    } else {
      liveFailed=true;
      // Load from cache on complete failure
      try{
        var c=JSON.parse(localStorage.getItem('mv_prices_cache')||'null');
        if(c&&(Date.now()-c.ts)<2*60*60*1000){
          Object.assign(LIVE,c.live);
          liveFromCache=true;liveUpdated=c.ts;
          S.portfolio.forEach(function(h){if(LIVE[h.t])h.cur=LIVE[h.t].price;});
        }
      }catch(e){/* silent */}

// ── TI ─────────────────────────────────────────────────────────
var TI={
  sma:function(p,n){return p.map(function(_,i){return i<n-1?null:p.slice(i-n+1,i+1).reduce(function(a,b){return a+b;},0)/n;});},
  ema:function(p,n){var k=2/(n+1),r=[p[0]];for(var i=1;i<p.length;i++)r.push(p[i]*k+r[i-1]*(1-k));return r;},
  rsi:function(p,n){
    n=n||14;if(p.length<n+1)return p.map(function(){return 50;});
    var d=p.slice(1).map(function(v,i){return v-p[i];});
    var g=d.map(function(c){return Math.max(c,0);});
    var l=d.map(function(c){return Math.abs(Math.min(c,0));});
    var ag=g.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
    var al=l.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
    var res=[];for(var j=0;j<=n;j++)res.push(50);
    for(var i=n;i<d.length;i++){ag=(ag*(n-1)+g[i])/n;al=(al*(n-1)+l[i])/n;res.push(al===0?100:100-100/(1+ag/al));}
    return res;
  },
  macd:function(p){
    var e12=this.ema(p,12),e26=this.ema(p,26);
    var line=e12.map(function(v,i){return v-e26[i];});
    var sig=this.ema(line,9);
    return{line:line,signal:sig,hist:line.map(function(v,i){return v-sig[i];})};
  },
  bb:function(p,n,m){
    n=n||20;m=m||2;
    var sma=this.sma(p,n);
    return p.map(function(_,i){
      if(!sma[i])return{mid:null,upper:null,lower:null};
      var sl=p.slice(Math.max(0,i-n+1),i+1);
      var avg=sma[i];
      var std=Math.sqrt(sl.reduce(function(s,v){return s+(v-avg)*(v-avg);},0)/sl.length);
      return{mid:avg,upper:avg+m*std,lower:avg-m*std};
    });
  }
};

// ── SVG CHARTS ─────────────────────────────────────────────────
function svgLine(data,keys,colors,W,H){
  W=W||420;H=H||120;
  if(!data||!data.length)return '<div style="height:'+H+'px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:11px">Sin datos</div>';
  var allVals=[];
  keys.forEach(function(k){data.forEach(function(d){if(d[k]!=null)allVals.push(d[k]);});});
  if(!allVals.length)return "";
  var minV=Math.min.apply(null,allVals)-5;
  var maxV=Math.max.apply(null,allVals)+5;
  var rng=maxV-minV||1;
  var xS=function(i){return (i/(data.length-1))*W;};
  var yS=function(v){return H-((v-minV)/(rng||1))*H;};
  var paths="";
  keys.forEach(function(k,ki){
    var pts=[];
    data.forEach(function(d,i){if(d[k]!=null)pts.push(xS(i).toFixed(1)+","+yS(d[k]).toFixed(1));});
    if(pts.length<2)return;
    var sw=ki===0?2:1.5;
    var da=ki>0?"stroke-dasharray='4 2'":"";
    var op=ki>2?"opacity='0.5'":"";
    paths+="<polyline points='"+pts.join(" ")+"' fill='none' stroke='"+colors[ki]+"' stroke-width='"+sw+"' stroke-linecap='round' stroke-linejoin='round' "+da+" "+op+"/>";
  });
  var grid=[.25,.5,.75].map(function(p){var y=(H*p).toFixed(1);var v=(minV+rng*(1-p)).toFixed(0);return "<line x1='0' y1='"+y+"' x2='"+W+"' y2='"+y+"' stroke='rgba(255,255,255,.04)' stroke-width='1'/><text x='2' y='"+(parseFloat(y)-2)+"' fill='#3d5278' font-size='8' font-family='JetBrains Mono'>$"+v+"</text>";}).join("");
  return "<svg viewBox='0 0 "+W+" "+H+"' style='width:100%;height:"+H+"px'>"+grid+paths+"</svg>";
}

function svgBars(data,key,W,H,zero){
  W=W||420;H=H||80;zero=zero||0;
  var vals=data.map(function(d){return d[key];}).filter(function(v){return v!=null;});
  if(!vals.length)return "";
  var minV=Math.min.apply(null,vals.concat([zero]));
  var maxV=Math.max.apply(null,vals.concat([zero]));
  var rng=maxV-minV||1;
  var bw=W/data.length;
  var bars=data.map(function(d,i){
    if(d[key]==null)return "";
    var pos=d[key]>=zero;
    var bh=Math.abs(d[key]-zero)/rng*H;
    var y=pos?((maxV-d[key])/rng*H):((maxV-zero)/rng*H);
    return "<rect x='"+(i*bw+1).toFixed(1)+"' y='"+y.toFixed(1)+"' width='"+(bw-2).toFixed(1)+"' height='"+bh.toFixed(1)+"' fill='"+(pos?"var(--green)":"var(--red)")+"' opacity='.8' rx='1'/>";
  }).join("");
  var zy=((maxV-zero)/rng*H).toFixed(1);
  return "<svg viewBox='0 0 "+W+" "+H+"' style='width:100%;height:"+H+"px'><line x1='0' y1='"+zy+"' x2='"+W+"' y2='"+zy+"' stroke='rgba(255,255,255,.1)' stroke-width='1'/>"+bars+"</svg>";
}

function svgVol(data,W,H){
  W=W||420;H=H||45;
  var maxV=Math.max.apply(null,data.map(function(d){return d.vol||0;}));
  if(!maxV)return "";
  var bw=W/data.length;
  var bars=data.map(function(d,i){
    var h=((d.vol||0)/maxV*H).toFixed(1);
    return "<rect x='"+(i*bw+1).toFixed(1)+"' y='"+(H-h).toFixed(1)+"' width='"+(bw-2).toFixed(1)+"' height='"+h+"' fill='var(--blue)' opacity='.5' rx='1'/>";
  }).join("");
  return "<svg viewBox='0 0 "+W+" "+H+"' style='width:100%;height:"+H+"px'>"+bars+"</svg>";
}

function genFallback(basePrice,days){
  var data=[];var p=basePrice*0.88;
  for(var i=0;i<days;i++){
    var chg=(Math.random()-0.48)*p*0.022;
    var c=Math.max(p+chg,1);
    data.push({date:"D"+(i+1),open:p,high:Math.max(p,c)*1.005,low:Math.min(p,c)*0.995,close:c,vol:Math.floor(Math.random()*50e6+10e6),p:i+1});
    p=c;
  }
  data[data.length-1].close=basePrice;
  return data;
}

// ── TIMESTAMP HELPERS ──────────────────────────────────────────
function relTime(hoursAgo){
  if(hoursAgo<1) return 'hace '+Math.round(hoursAgo*60)+'m';
  if(hoursAgo<24) return 'hace '+Math.round(hoursAgo)+'h';
  if(hoursAgo<48) return 'hace 1 día';
  return 'hace '+Math.round(hoursAgo/24)+' días';
}

function saveNewsCache(data){
  try{localStorage.setItem('mv_news_cache',JSON.stringify({ts:Date.now(),data:data}));}catch(e){/* silent */}
}
function loadNewsCache(){
  try{
    var c=localStorage.getItem('mv_news_cache');
    if(!c) return null;
    var p=JSON.parse(c);
    // Valid for 2 hours
    if(Date.now()-p.ts < 2*60*60*1000) return p.data;
  }catch(e){/* silent */}
  return null;
}

  var rows=S.portfolio.map(function(h){
    var stop=h.cur*.92;var ps=rA/(h.cur-stop)*h.cur;var rr=(h.cur*.15)/(h.cur-stop);
    return {t:h.t,cur:h.cur,stop:stop,ps:ps,rr:rr};
  });

  var tableRows=rows.slice(0,8).map(function(r){
    return '<tr class="trow" onclick="openDrawer(\''+r.t+'\','+r.cur+')">'+

      '<td style="color:var(--amber)">$'+fmt(rA)+'</td>'+
      '<td style="font-weight:600">$'+fmt(r.ps)+'</td>'+
      '<td>'+fmtD(r.ps/r.cur)+'</td>'+
      '<td style="font-weight:600;color:'+(r.rr>=2?"var(--green)":r.rr>=1.5?"var(--orange)":"var(--red)")+'">'+fmtD(r.rr)+'x</td></tr>';
  }).join("");

  var scRows=SCENARIOS.map(function(sc){
    var pnl=sc.prob*sc.ret*cap;
    return '<div class="scrow">'+
      '<div style="width:110px;font-size:12px;font-weight:600;color:var(--bright)">'+sc.name+'</div>'+

  }).join("");

  var rrRows=rows.slice(0,6).map(function(r){
    return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+

  }).join("");

  document.getElementById("main").innerHTML=

function renderBack(){
  var trades=[
    {id:1,date:"2024-01-15",entry:468,exit:487},
    {id:2,date:"2024-02-05",entry:472,exit:493},
    {id:3,date:"2024-03-01",entry:481,exit:497},
    {id:4,date:"2024-04-10",entry:488,exit:476},
    {id:5,date:"2024-05-08",entry:491,exit:510},
    {id:6,date:"2024-06-18",entry:498,exit:519},
    {id:7,date:"2024-07-15",entry:505,exit:496},
    {id:8,date:"2024-08-20",entry:512,exit:531},
    {id:9,date:"2024-09-18",entry:524,exit:518},
    {id:10,date:"2024-10-10",entry:537,exit:556}
  ];
  var cum=0;
  var rows=trades.map(function(t){
    var pnl=(t.exit-t.entry)*10;cum+=pnl;
    return {id:t.id,date:t.date,entry:t.entry,exit:t.exit,pnl:pnl,ret:(t.exit-t.entry)/t.entry,cum:cum};
  });
  var wins=rows.filter(function(r){return r.pnl>0;}).length;
  var tot=rows.reduce(function(s,r){return s+r.pnl;},0);
  var maxEq=Math.max.apply(null,rows.map(function(r){return r.cum;}));
  var minEq=Math.min.apply(null,[0].concat(rows.map(function(r){return r.cum;})));

  var tableRows=rows.map(function(r){
    return '<tr>'+
      '<td style="color:var(--text3)">'+r.id+'</td>'+
      '<td style="font-size:10px;color:var(--text3)">'+r.date+'</td>'+
      '<td style="font-weight:600;color:var(--bright)">SPY</td>'+
      '<td>$'+fmtD(r.entry)+'</td><td>$'+fmtD(r.exit)+'</td>'+
      '<td style="font-weight:600;color:'+(r.pnl>=0?"var(--green)":"var(--red)")+'">'+(r.pnl>=0?"+":"")+'$'+fmtD(r.pnl)+'</td>'+
      '<td style="color:'+(r.pnl>=0?"var(--green)":"var(--red)")+'">'+pct(r.ret)+'</td>'+
      '<td style="font-weight:600;color:'+(r.cum>=0?"var(--green)":"var(--red)")+'">'+(r.cum>=0?"+":"")+'$'+fmt(r.cum)+'</td></tr>';
  }).join("");

  var rng=maxEq-minEq||1;
  var eqBars=rows.map(function(r,i){
    var h=((r.cum-minEq)/rng*90).toFixed(0);
    return '<div style="flex:1;background:'+(r.cum>=0?"var(--green)":"var(--red)")+';opacity:.75;border-radius:2px 2px 0 0;height:'+h+'px;align-self:flex-end;min-height:2px"></div>';
  }).join("");

  document.getElementById("main").innerHTML=
    '<div class="ph"><div><h1>Backtesting Engine</h1><p class="sub-txt">// SMA Crossover · SPY · 2024</p></div></div>'+
    '<div class="krow">'+
    kpi("Trades",rows.length,"","b")+
    kpi("Win Rate",pct(wins/rows.length),wins+"/"+rows.length,"g")+
    kpi("Total Return",D(tot),tot>=0?"+Positivo":"Negativo",tot>=0?"g":"r")+
    kpi("Avg/Trade",D(tot/rows.length),"","a")+
    kpi("Max Win",D(Math.max.apply(null,rows.map(function(r){return r.pnl;}))),"","g")+
    '</div>'+
    '<div class="cb" style="margin-bottom:14px">'+
    '<div class="st"><div class="stbar"></div>Equity Curve — SPY · 2024</div>'+
    '<div style="display:flex;gap:2px;height:90px;align-items:flex-end;padding:0 4px">'+eqBars+'</div>'+
    '</div>'+
    '<div class="tw" style="max-height:320px;overflow-y:auto"><table>'+
    '<thead><tr><th>#</th><th>Fecha</th><th>Asset</th><th>Entry</th><th>Exit</th><th>P&L</th><th>Return</th><th>Acum.</th></tr></thead>'+
    '<tbody>'+tableRows+'</tbody></table></div>';
}

async function loadDrawerHistory(ticker,price){
  var rangeMap={30:"1mo",60:"2mo",90:"3mo",130:"6mo"};
  var rng=rangeMap[dRange]||"3mo";
  var k=ticker+"_"+dRange;
  if(!dHistCache[k]){
    var hist=await fetchHistory(ticker,rng);
    dHistCache[k]=hist&&hist.length>5?hist:genFallback(price,dRange);
  }
  renderDrawerBody();
}

function setDTab(t){dTab=t;renderDrawerBody();}
function setDRange(r){
  var ticker=dTicker;
  var price=getLivePrice(ticker);
  dRange=r;
  var k=ticker+"_"+r;
  if(!dHistCache[k]){
    document.getElementById("drwb").innerHTML='<div class="dload"><div class="spin"></div>Cargando histórico...</div>';
    loadDrawerHistory(ticker,price);
  } else {
    renderDrawerBody();
  }
}

var AI={open:false,messages:[],loading:false};

function toggleAI(){
  AI.open=!AI.open;

  if(!panel){renderAIPanel();return;}
  panel.style.transform=AI.open?'translateX(0)':'translateX(100%)';

function buildPortfolioContext(){
  var port=S.portfolio;
  var totM=port.reduce(function(s,h){return s+h.sh*h.cur;},0);
  var totC=port.reduce(function(s,h){return s+h.sh*h.cost;},0);
  var pnl=totM-totC;
  var lines=["PORTFOLIO DEL USUARIO:"];
  lines.push("Capital total: $"+fmt(S.capital));
  lines.push("Valor de mercado: $"+fmt(totM));
  lines.push("P&L total: "+(pnl>=0?"+":"")+D(pnl)+" ("+(pnl>=0?"+":"")+pct(pnl/(totC||1))+")");
  lines.push("\nPOSICIONES:");
  port.forEach(function(h){
    var pnlH=h.sh*(h.cur-h.cost);
    lines.push("- "+h.t+" ("+h.type+"): "+h.sh+" acciones @ $"+fmtD(h.cost)+" entrada, $"+fmtD(h.cur)+" actual, P&L: "+(pnlH>=0?"+":"")+D(pnlH));
  });
  lines.push("\nWATCHLIST: "+S.watchlist.join(", "));
  lines.push("\nSEÑALES ACTUALES:");
  ALL_SIG.slice(0,8).forEach(function(s){
    lines.push("- "+s.t+": "+s.sig+" (Score "+s.sc+", precio $"+(s.p?fmtD(s.p):"—")+")");
  });
  lines.push("\nNOTICIAS RELEVANTES (semana actual):");
  NEWS_DATA.slice(0,4).forEach(function(n){
    lines.push("- ["+n.cat+"] "+n.title+" ("+relTime(n.hoursAgo)+")");
  });
  return lines.join("\n");
}

// ── EXPORT CSV ──────────────────────────────────────────────────────────────
function exportCSV(){
  var port=S.portfolio;
  var totM=port.reduce(function(s,h){return s+h.sh*h.cur;},0);
  var rows=[['Ticker','Tipo','Shares','Entrada','Precio Actual','Valor','P&L $','Return %','Peso %','Fecha']];
  var date=new Date().toLocaleDateString('es-CL');
  port.forEach(function(h){
    var pnl=h.sh*(h.cur-h.cost);
    var ret=(h.cur-h.cost)/h.cost*100;
    var w=(h.sh*h.cur)/(totM||1)*100;
    rows.push([h.t,h.type,h.sh,h.cost.toFixed(2),h.cur.toFixed(2),(h.sh*h.cur).toFixed(2),pnl.toFixed(2),ret.toFixed(2),w.toFixed(2),date]);
  });
  var totC=port.reduce(function(s,h){return s+h.sh*h.cost;},0);
  var tPnl=port.reduce(function(s,h){return s+h.sh*(h.cur-h.cost);},0);
  rows.push(['TOTAL','','','','',totM.toFixed(2),tPnl.toFixed(2),((tPnl/(totC||1))*100).toFixed(2),'100','']);
  var csv=rows.map(function(r){
    return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');
  }).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='magnova-'+new Date().toISOString().split('T')[0]+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function pbFill(ticker,price){
  PB.ticker=ticker;PB.price=price;PB.stop=0;
  renderPB();
  setTimeout(function(){pbCalc();},50);
}

function pbFetchPrice(){
  var t=PB.ticker.toUpperCase().trim();
  if(!t) return;
  if(LIVE[t]){
    PB.price=LIVE[t].price;
    var el=document.getElementById('pb-price');
    if(el) el.value=LIVE[t].price.toFixed(2);
  } else {
    fetchQuote(t).then(function(q){
      if(q){LIVE[t]=q;PB.price=q.price;var el=document.getElementById('pb-price');if(el)el.value=q.price.toFixed(2);}
    });
  }
}

function pbCalc(){
  var ticker=(document.getElementById('pb-ticker')||{}).value||PB.ticker;
  var price=parseFloat((document.getElementById('pb-price')||{}).value)||PB.price;
  var capital=parseFloat((document.getElementById('pb-capital')||{}).value)||PB.capital||S.capital;
  var risk=parseFloat((document.getElementById('pb-risk')||{}).value)||PB.risk||2;
  var stop=parseFloat((document.getElementById('pb-stop')||{}).value)||PB.stop||0;
  if(!price||!capital) return;
  if(!stop) stop=price*0.92;
  var riskPct=(price-stop)/price;
  if(riskPct<=0) return;
  var riskAmt=capital*(risk/100);
  var posSize=riskAmt/riskPct;
  var units=posSize/price;
  var target=price+2*(price-stop);
  var rr=(target-price)/(price-stop);
  PB.ticker=ticker;PB.price=price;PB.capital=capital;PB.risk=risk;PB.stop=stop;
  PB.computed={ticker:ticker,price:price,stop:stop,target:target,riskAmt:riskAmt,posSize:posSize,units:units,rr:rr};
  renderPB();
}

function pbAddToPortfolio(){
  if(!PB.computed) return;
  var c=PB.computed;
  var plan=planOf();
  if(S.portfolio.length>=plan.maxT&&plan.maxT<999){openModal('upgrade');return;}
  S.portfolio.push({id:S.nextId++,t:c.ticker,type:'Stock',sh:parseFloat(c.units.toFixed(4)),cost:c.price,cur:c.price});
  persist();setPage('port');
}


// ── MARKET SENTIMENT GAUGE ──────────────────────────────────────────────────
function calcSentiment(){
  var buyPct=(ALL_SIG.filter(function(s){return s.sig==='BUY';}).length/ALL_SIG.length)*100;
  var sigAvg=ALL_SIG.reduce(function(s,x){return s+x.sc;},0)/ALL_SIG.length;
  var port=S.portfolio;
  var totC=port.reduce(function(s,h){return s+h.sh*h.cost;},0);
  var totM=port.reduce(function(s,h){return s+h.sh*h.cur;},0);
  var pnlPct=totC?((totM-totC)/(totC||1))*100:0;
  var momentumScore=Math.max(0,Math.min(100,50+pnlPct*2));
  var vixScore=Math.max(0,Math.min(100,100-(16.8-10)*3));
  var rsiAvg=0,rsiCount=0;
  port.forEach(function(h){var sig=ALL_SIG.find(function(x){return x.t===h.t;});if(sig){rsiAvg+=sig.sc;rsiCount++;}});
  rsiAvg=rsiCount?rsiAvg/rsiCount:sigAvg;
  var score=Math.round(buyPct*0.30+sigAvg*0.15+rsiAvg*0.25+vixScore*0.15+momentumScore*0.15);
  score=Math.max(0,Math.min(100,score));
  var label,color,emoji,desc;
  if(score<=20){label='Miedo Extremo';color='#e84142';emoji='😱';desc='Oportunidad de compra. Mercado vende sin discriminar.';}
  else if(score<=40){label='Miedo';color='#f59e0b';emoji='😰';desc='Cautela. Posible sobreacción bajista en el corto plazo.';}
  else if(score<=60){label='Neutral';color='#6b80a0';emoji='😐';desc='Sin señal clara. El mercado procesa información.';}
  else if(score<=80){label='Codicia';color='#f7931a';emoji='😏';desc='Optimismo. Cuidado con FOMO. Considera toma parcial de ganancias.';}
  else{label='Codicia Extrema';color='#26a65b';emoji='🤑';desc='Euforia. Riesgo de corrección. Revisa stops y diversificación.';}
  return{score:score,label:label,color:color,emoji:emoji,desc:desc,
    components:[
      {name:'Señales BUY',value:buyPct.toFixed(0)+'%',score:buyPct,icon:'⚡'},
      {name:'Score promedio',value:sigAvg.toFixed(0)+'/100',score:sigAvg,icon:'📊'},
      {name:'RSI portfolio',value:rsiAvg.toFixed(0),score:rsiAvg,icon:'📈'},
      {name:'VIX (inv.)',value:'16.8',score:vixScore,icon:'🌡'},
      {name:'Momentum P&L',value:(pnlPct>=0?'+':'')+pnlPct.toFixed(1)+'%',score:momentumScore,icon:'💰'}
    ]
  };
}

function buildDial(score,color,size){
  var sz=size||200,cy=sz*0.5;
  var ang=((score/100)*180)-90;
  var rad=(ang-90)*Math.PI/180;
  var r=sz*0.37;
  var nx=(sz/2+r*Math.cos(rad)).toFixed(1);
  var ny=(cy+r*Math.sin(rad)).toFixed(1);
  var segs=[['#e84142',0,.2],['#f59e0b',.2,.4],['#6b80a0',.4,.6],['#f7931a',.6,.8],['#26a65b',.8,1]];
  var arcs=segs.map(function(seg){
    var s1=seg[1]*Math.PI,s2=seg[2]*Math.PI,sr=sz*0.41;
    var x1=(sz/2-sr*Math.cos(s1)).toFixed(1),y1=(cy-sr*Math.sin(s1)).toFixed(1);
    var x2=(sz/2-sr*Math.cos(s2)).toFixed(1),y2=(cy-sr*Math.sin(s2)).toFixed(1);
    return '<path d="M '+x1+' '+y1+' A '+sr+' '+sr+' 0 0 1 '+x2+' '+y2+'" fill="none" stroke="'+seg[0]+'" stroke-width="'+(sz*0.065).toFixed(0)+'" opacity=".5"/>';
  }).join('');
  return '<svg viewBox="0 0 '+sz+' '+(cy+14)+'" style="width:100%;display:block">'+
    arcs+
    '<line x1="'+(sz/2)+'" y1="'+cy+'" x2="'+nx+'" y2="'+ny+'" stroke="'+color+'" stroke-width="3" stroke-linecap="round"/>'+
    '<circle cx="'+(sz/2)+'" cy="'+cy+'" r="6" fill="'+color+'" opacity=".2"/>'+
    '<circle cx="'+(sz/2)+'" cy="'+cy+'" r="3" fill="'+color+'"/>'+
    '<text x="'+(sz/2)+'" y="'+(cy-6)+'" text-anchor="middle" fill="'+color+'" font-size="'+(sz*0.12).toFixed(0)+'" font-weight="700" font-family="JetBrains Mono,monospace">'+score+'</text>'+
    '</svg>';
}

// ── HEALTH SCORE ──────────────────────────────────────────────────
function calcHealthScore(){
  var port=S.portfolio;
  if(!port||!port.length) return{total:0,subs:{div:0,mom:0,risk:0,corr:0,val:0}};

  var totM=port.reduce(function(s,h){return s+h.sh*(getLivePrice(h.t)||h.cur||0);},0);

  // 1. Diversificación — HHI (Herfindahl-Hirschman Index)
  var hhi=0;
  port.forEach(function(h){
    var w=totM>0?(h.sh*(getLivePrice(h.t)||h.cur||0))/totM:0;
    hhi+=w*w;
  });
  var divScore=Math.round(Math.max(0,Math.min(100,(1-hhi)*120)));

  // 2. Momentum — % posiciones en verde
  var inProfit=port.filter(function(h){
    return (getLivePrice(h.t)||h.cur||0)>h.cost;
  }).length;
  var momScore=Math.round((inProfit/port.length)*100);

  // 3. Riesgo de concentración — mayor posición
  var weights=port.map(function(h){
    return totM>0?(h.sh*(getLivePrice(h.t)||h.cur||0))/totM:0;
  });
  var maxW=Math.max.apply(null,weights);
  var riskScore=Math.round(Math.max(0,Math.min(100,(1-maxW)*130)));

  // 4. Correlación — diversificación por tipo de activo
  var types={};
  port.forEach(function(h){ types[h.type]=(types[h.type]||0)+1; });
  var nTypes=Object.keys(types).length;
  var corrScore=Math.round(Math.min(100,nTypes*28));

  // 5. Valoración — ratio señales BUY vs SELL en el portfolio
  var portTickers=port.map(function(h){return h.t;});
  var sigs=ALL_SIG.filter(function(s){return portTickers.indexOf(s.t)>=0;});
  var buys=sigs.filter(function(s){return s.sig==='BUY';}).length;
  var sells=sigs.filter(function(s){return s.sig==='SELL';}).length;
  var total=sigs.length||1;
  var valScore=Math.round(((buys-sells*0.5)/total)*80+40);
  valScore=Math.max(0,Math.min(100,valScore));

  var totalScore=Math.round(divScore*0.25+momScore*0.20+riskScore*0.25+corrScore*0.15+valScore*0.15);

  return{
    total:Math.max(0,Math.min(100,totalScore)),
    subs:{div:divScore,mom:momScore,risk:riskScore,corr:corrScore,val:valScore}
  };
}

    var encoded=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    var url=window.location.href.split('#')[0]+'#radar='+encoded;

    // Copy to clipboard
    if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(function(){
        radarToast('🔗 Link copiado al portapapeles — válido 7 días');
      });
    } else {
      // Fallback: show the URL
      var ta=document.createElement('textarea');
      ta.value=url;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      radarToast('🔗 Link copiado al portapapeles');
    }
  }catch(e){
    radarToast('Error al generar el link');
  }
}

    Object.entries({

  var sectHTML=r.sections.map(function(sec){
    var icon=sectionIcons[sec.id]||'📌';
    var color=sectionColors[sec.id]||'var(--text)';
    // Format action plan with numbered items
    var content=sec.content||'';
    content=content.replace(/\n(\d+)\.\s/g,'<br><span style="color:var(--orange);font-weight:700">$1.</span> ');
    content=content.replace(/\n/g,'<br>');
    return '<div class="radar-section" style="background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-bottom:10px">'+

function getTrialDaysLeft(){
  if(!S.user||S.user.plan!=='trial') return null;
  var started=S.user.trialStarted||Date.now();
  var elapsed=(Date.now()-started)/(1000*60*60*24);
  return Math.max(0,Math.ceil(14-elapsed));
}

function trialBanner(){
  var days=getTrialDaysLeft();
  if(!S.user||!days&&days!==0) return '';
  var urgency=days<=3?'var(--red)':days<=7?'var(--orange)':'var(--blue)';
  var msg=days===0?'Tu trial termina hoy — Activa Pro para no perder acceso':
          days===1?'Último día de trial — Upgrade antes de que expire':
          'Te quedan '+days+' días de trial Pro gratuito';
  return '<div style="background:'+urgency+';padding:8px 16px;display:flex;align-items:center;gap:10px;font-size:11px;font-family:\'JetBrains Mono\',monospace;color:#fff">'+
    '<span>⏰ '+msg+'</span>'+

    '</div>';
}

    {icon:'🤖',title:'AI Advisor — tu coach personal',

     action:'Ver Chile/LATAM',page:'latam'},
  ];

  var step=steps[ONBOARD.step];

  var isLast=ONBOARD.step===steps.length-1;

  document.getElementById('mroot').innerHTML=
    '<div class="overlay" style="z-index:500" onclick="">'+
    '<div class="modal" style="max-width:440px;text-align:center" onclick="event.stopPropagation()">'+
    // Progress bar
    '<div style="height:3px;background:var(--border);border-radius:2px;margin-bottom:22px;overflow:hidden">'+
    '<div style="height:100%;width:'+progress+'%;background:var(--orange);border-radius:2px;transition:.4s"></div></div>'+
    // Step counter
    '<div style="font-size:9px;color:var(--text3);font-family:\'JetBrains Mono\',monospace;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:16px">'+
    'Paso '+(ONBOARD.step+1)+' de '+steps.length+'</div>'+

    '<div style="font-size:48px;margin-bottom:14px">'+step.icon+'</div>'+

    '<div style="display:flex;gap:10px;justify-content:center">'+
    (ONBOARD.step>0?'<button class="btn" onclick="onboardPrev()">← Anterior</button>':'')+
    (isLast?
      '<button class="btn-big" onclick="onboardFinish()">Empezar a invertir 🚀</button>':
      '<button class="btn-big" onclick="onboardNext()">'+step.action+' →</button>')+
    '</div>'+
    // Skip
    '<div style="margin-top:14px"><button onclick="onboardFinish()" style="background:transparent;border:none;color:var(--text3);font-size:11px;cursor:pointer;font-family:\'JetBrains Mono\',monospace">Saltar tour</button></div>'+
    '</div></div>';
}

function onboardNext(){
  var steps=[{page:'port'},{page:'sig'},{page:'pb'},{fn:'toggleAI'},{page:'latam'}];
  var s=steps[ONBOARD.step];
  if(s.fn) window[s.fn]&&window[s.fn]();
  else if(s.page) S.page=s.page;
  ONBOARD.step++;
  if(ONBOARD.step<steps.length) showOnboarding();
  else onboardFinish();
}
function onboardPrev(){ONBOARD.step=Math.max(0,ONBOARD.step-1);showOnboarding();}
function onboardFinish(){
  document.getElementById('mroot').innerHTML='';
  ONBOARD.shown=true;
  try{localStorage.setItem('mv_onboard_done','1');}catch(e){/* silent */}
  renderMain();
}
function checkOnboarding(){
  try{if(localStorage.getItem('mv_onboard_done')) return;}catch(e){/* silent */}
  if(!ONBOARD.shown&&S.user){
    setTimeout(showOnboarding, 800);
  }
}

// ── KEYBOARD SHORTCUTS ─────────────────────────────────────────
var KS_SHOWN=false;
document.addEventListener('keydown',function(e){
  if(!S.user) return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  var map={
    'n':'news','d':'dash','p':'port','w':'watch','s':'sig',
    'b':'pb','c':'comp','m':'sentiment','a':'coach','l':'latam',
    'i':'ind','r':'risk','k':'back','t':'alert'
  };
  if(e.key==='?' ){showShortcuts();return;}
  if(e.key==='Escape'){
    document.getElementById('mroot').innerHTML='';
    closeDrawer();
    if(document.getElementById('ai-panel'))
      document.getElementById('ai-panel').style.transform='translateX(100%)';
    return;
  }
  if(e.altKey&&map[e.key.toLowerCase()]){
    e.preventDefault();
    setPage(map[e.key.toLowerCase()]);
  }
  if(e.key==='r'&&e.ctrlKey){e.preventDefault();manualRefresh();}
});

// ── COMPARADOR DE ACTIVOS ────────────────────────────────────────
var COMP={tickers:["AAPL","MSFT"],range:60,data:{},loading:false};

function compSet(t1,t2,t3,t4){
  COMP.tickers=[t1,t2];
  if(t3) COMP.tickers.push(t3);
  if(t4) COMP.tickers.push(t4);
  COMP.data={};
  compLoad();
}
function compAddTicker(){
  if(COMP.tickers.length<4){COMP.tickers.push("NEW");COMP.data={};renderComp();}
}
function compRemove(i){
  COMP.tickers.splice(i,1);
  COMP.data={};
  if(COMP.tickers.length<2) COMP.tickers=["AAPL","MSFT"];
  renderComp();
}
function compChangeTicker(i,val){
  COMP.tickers[i]=(val||"").toUpperCase().trim();
  COMP.data={};
  COMP.loading=false;
}

function renderComp(){
  var colors=["var(--orange)","var(--blue)","var(--green)","#a78bfa"];

  var tickerInputs=COMP.tickers.map(function(t,i){
    var lp=getLivePrice(t);
    var lq=LIVE[t];
    var chg=lq?((lq.changePct||0)*100).toFixed(2):null;
    var pos=chg!==null&&parseFloat(chg)>=0;
    return '<div style="display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid '+colors[i]+'33;border-radius:8px;padding:9px 12px;margin-bottom:8px">'+
      '<div style="width:8px;height:8px;border-radius:50%;background:'+colors[i]+';flex-shrink:0"></div>'+
      '<input class="inp" style="flex:1;font-size:12px;font-weight:700;text-transform:uppercase" value="'+t+'" maxlength="8" onchange="compChangeTicker('+i+',this.value)" onblur="COMP.data={};renderComp()"/>'+
      '<div style="text-align:right">'+
      '<div style="font-size:11px;font-weight:600;color:var(--bright);font-family:\'JetBrains Mono\',monospace">$'+fmtD(lp)+'</div>'+
      (chg!==null?'<div style="font-size:9px;color:'+(pos?'var(--green)':'var(--red)')+'">'+( pos?'+':'')+chg+'%</div>':'<div style="font-size:9px;color:var(--text3)">—</div>')+
      '</div>'+
      (COMP.tickers.length>2?'<button onclick="compRemove('+i+')" style="background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:13px;line-height:1;padding:2px">✕</button>':'')+
      '</div>';
  }).join('');

  var rangeBtns=[[30,"1M"],[60,"2M"],[90,"3M"],[130,"6M"]].map(function(p){
    return '<button class="tab'+(COMP.range===p[0]?" act":"")+
      '" onclick="COMP.range='+p[0]+';COMP.data={};compLoad()">'+p[1]+'</button>';
  }).join('');

  var SUGS=[
    ["AAPL","MSFT","Los 2 grandes Tech"],
    ["SPY","QQQ","IVV","ETFs de índice"],
    ["NVDA","AMD","Chips / IA"],
    ["GOOGL","META","Publicidad digital"],
    ["BRK-B","JPM","Value vs Banking"],
    ["VTI","VXUS","US vs Global"]
  ];
  var sugRows=SUGS.map(function(s){
    var label=s.slice(0,-1).join(" vs ");
    var desc=s[s.length-1];
    var args=s.slice(0,-1).map(function(t){return '"'+t+'"';}).join(",");
    return '<div onclick="compSet('+args+')" style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;cursor:pointer;border-radius:6px;border:1px solid var(--border);margin-bottom:4px;transition:.15s" onmouseover="this.style.borderColor=\'var(--orange-bd)\';this.style.background=\'var(--orange-bg)\'" onmouseout="this.style.borderColor=\'var(--border)\';this.style.background=\'transparent\'">'+
      '<span style="font-size:11px;font-weight:600;color:var(--bright);font-family:\'JetBrains Mono\',monospace">'+label+'</span>'+
      '<span style="font-size:10px;color:var(--text3)">'+desc+'</span></div>';
  }).join('');

  var chartContent='';
  var statsContent='';
  var hasData=Object.keys(COMP.data).length===COMP.tickers.length;

  if(COMP.loading){
    chartContent='<div class="dload"><div class="spin"></div>Cargando histórico...</div>';
  } else if(!hasData){
    chartContent='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;text-align:center;color:var(--text3)">'+
      '<div style="font-size:40px;margin-bottom:10px">⚖️</div>'+
      '<div style="font-size:13px;font-weight:600;color:var(--bright);margin-bottom:5px">Comparador head-to-head</div>'+
      '<div style="font-size:11px;font-family:\'JetBrains Mono\',monospace">Presiona "Comparar" para cargar datos reales</div></div>';
  } else {
    var series=[];
    COMP.tickers.forEach(function(t,ti){
      var hist=COMP.data[t];
      if(!hist||!hist.length) return;
      var base=hist[0].close;
      var pts=hist.map(function(d,i){return{x:i,y:(d.close/base-1)*100,close:d.close};});
      series.push({t:t,pts:pts,color:colors[ti]});
    });

    if(series.length>0){
      var W=520,H=200;
      var allY=[];
      series.forEach(function(s){s.pts.forEach(function(p){allY.push(p.y);});});
      var minY=Math.min.apply(null,allY)-3;
      var maxY=Math.max.apply(null,allY)+3;
      var rng=maxY-minY||1;
      var nPts=series[0].pts.length;
      var xS=function(i){return(i/Math.max(nPts-1,1))*W;};
      var yS=function(v){return H-((v-minY)/rng)*H;};

      var grid='';
      [-20,-10,0,10,20,30].forEach(function(v){
        if(v<minY||v>maxY) return;
        var y=yS(v).toFixed(1);
        var col=v===0?'rgba(255,255,255,.15)':'rgba(255,255,255,.04)';
        grid+="<line x1='0' y1='"+y+"' x2='"+W+"' y2='"+y+"' stroke='"+col+"' stroke-width='1'/>";
        grid+="<text x='3' y='"+(parseFloat(y)-2).toFixed(1)+"' fill='var(--text3)' font-size='8' font-family='JetBrains Mono,monospace'>"+(v>=0?'+':'')+v+"%</text>";
      });

      var lines_svg=series.map(function(s){
        var pts_str=s.pts.map(function(p){return xS(p.x).toFixed(1)+','+yS(p.y).toFixed(1);}).join(' ');
        var last=s.pts[s.pts.length-1];
        var lx=xS(last.x);var ly=yS(last.y);
        return "<polyline points='"+pts_str+"' fill='none' stroke='"+s.color+"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>"+
          "<circle cx='"+lx.toFixed(1)+"' cy='"+ly.toFixed(1)+"' r='3' fill='"+s.color+"'/>"+
          "<text x='"+(lx+5).toFixed(1)+"' y='"+(ly+3).toFixed(1)+"' fill='"+s.color+"' font-size='9' font-weight='700' font-family='JetBrains Mono,monospace'>"+s.t+" "+(last.y>=0?'+':'')+last.y.toFixed(1)+"%</text>";
      }).join('');

      chartContent='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:'+H+'px">'+grid+lines_svg+'</svg>';

      // Stats
      var tickerStats=series.map(function(s){
        var closes=s.pts.map(function(p){return p.close;});
        var returns=closes.slice(1).map(function(c,i){return(c-closes[i])/closes[i]*100;});
        var mean=returns.reduce(function(a,b){return a+b;},0)/(returns.length||1);
        var vol=Math.sqrt(returns.reduce(function(a,r){return a+(r-mean)*(r-mean);},0)/(returns.length||1));
        var ret=s.pts[s.pts.length-1].y;
        var maxR=Math.max.apply(null,s.pts.map(function(p){return p.y;}));
        var minR=Math.min.apply(null,s.pts.map(function(p){return p.y;}));
        var sharpe=vol>0?(mean/vol)*Math.sqrt(252/(closes.length||1)):0;
        var sig=ALL_SIG.find(function(x){return x.t===s.t;})||{sig:'HOLD',sc:60};
        var lq=LIVE[s.t];
        return{t:s.t,color:s.color,ret:ret,vol:vol,maxR:maxR,minR:minR,sharpe:sharpe,
          cur:lq?lq.price:closes[closes.length-1],sig:sig.sig+' ('+sig.sc+')',returns:returns};
      });

      if(tickerStats.length>=2){
        var r0=tickerStats[0].returns;
        tickerStats.forEach(function(s,i){
          if(i===0){s.corr=1.00;return;}
          var n=Math.min(r0.length,s.returns.length);
          var m1=r0.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
          var m2=s.returns.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
          var cov=0,v1=0,v2=0;
          for(var k=0;k<n;k++){cov+=(r0[k]-m1)*(s.returns[k]-m2);v1+=(r0[k]-m1)*(r0[k]-m1);v2+=(s.returns[k]-m2)*(s.returns[k]-m2);}
          s.corr=(v1>0&&v2>0)?cov/Math.sqrt(v1*v2):0;
        });
      }

      var METRICS=[
        {k:'ret',    label:'Retorno período', fmt:function(v){return(v>=0?'+':'')+v.toFixed(2)+'%';}, higher:true},
        {k:'vol',    label:'Volatilidad',      fmt:function(v){return v.toFixed(2)+'%';},              higher:false},
        {k:'sharpe', label:'Sharpe ratio',     fmt:function(v){return v.toFixed(2)+'x';},              higher:true},
        {k:'maxR',   label:'Máximo',           fmt:function(v){return(v>=0?'+':'')+v.toFixed(2)+'%';}, higher:true},
        {k:'minR',   label:'Mínimo',           fmt:function(v){return(v>=0?'+':'')+v.toFixed(2)+'%';}, higher:true},
        {k:'cur',    label:'Precio actual',    fmt:function(v){return'$'+fmtD(v);},                    higher:null},
        {k:'corr',   label:'Correlación',      fmt:function(v){return v!==null&&v!==undefined?v.toFixed(2):'—';}, higher:null},
      ];

      var headerRow='<tr><th>Métrica</th>'+tickerStats.map(function(s){return'<th style="color:'+s.color+'">'+s.t+'</th>';}).join('')+'<th>Mejor</th></tr>';
      var dataRows=METRICS.map(function(m){
        var best=null;
        if(m.higher!==null&&tickerStats.length>1){
          best=tickerStats.reduce(function(a,b){return(m.higher?a[m.k]>=b[m.k]:a[m.k]<=b[m.k])?a:b;}).t;
        }
        var cells=tickerStats.map(function(s){
          var v=s[m.k];var fmt=m.fmt(v);var isBest=best===s.t;
          var col='var(--text)';
          if(m.k==='ret'||m.k==='maxR'||m.k==='minR') col=typeof v==='number'?(v>=0?'var(--green)':'var(--red)'):'var(--text)';
          if(m.k==='sharpe') col=typeof v==='number'?(v>=1?'var(--green)':v>=0.5?'var(--orange)':'var(--red)'):'var(--text)';
          return '<td style="color:'+col+';font-weight:'+(isBest?'700':'400')+'">'+fmt+'</td>';
        }).join('');
        var bestCell=best?'<td><span style="font-size:9px;padding:2px 7px;border-radius:3px;background:rgba(34,197,94,.1);color:var(--green);font-family:\'JetBrains Mono\',monospace">'+best+' 🏆</span></td>':'<td style="color:var(--text3)">—</td>';
        return '<tr class="trow"><td style="font-size:11px;color:var(--text2)">'+m.label+'</td>'+cells+bestCell+'</tr>';
      }).join('');

      statsContent='<div class="tw" style="margin-top:14px"><table><thead>'+headerRow+'</thead><tbody>'+dataRows+'</tbody></table></div>';

      if(tickerStats.length>=2){
        var corrInsight=tickerStats.slice(1).map(function(s){
          if(s.corr===null||s.corr===undefined) return '';
          var c=s.corr;
          var advice=c>0.8?'⚠️ Poca diversificación':c<0.2?'✅ Excelente par para diversificar':'📊 Correlación '+(c>0.5?'moderada':'baja');
          return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)">'+
            '<span style="font-size:11px;color:var(--bright);font-family:\'JetBrains Mono\',monospace">'+tickerStats[0].t+' vs '+s.t+'</span>'+
            '<span style="font-size:11px;color:var(--text2)">'+advice+'</span>'+
            '<span style="font-size:11px;font-weight:700;color:var(--orange);font-family:\'JetBrains Mono\',monospace">'+c.toFixed(2)+'</span></div>';
        }).join('');
        if(corrInsight) statsContent+='<div class="cb" style="margin-top:12px"><div class="st"><div class="stbar"></div>Correlación</div>'+corrInsight+
          '<div style="font-size:9px;color:var(--text3);margin-top:8px;font-family:\'JetBrains Mono\',monospace">1.0=idéntico · 0=independientes · -1=opuestos</div></div>';
      }
    }
  }

  var legend=COMP.tickers.map(function(t,i){
    return '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px">'+
      '<span style="width:16px;height:2px;background:'+colors[i]+';display:inline-block;border-radius:1px;flex-shrink:0"></span>'+
      '<span style="font-size:10px;font-weight:600;color:'+colors[i]+';font-family:\'JetBrains Mono\',monospace">'+t+'</span></span>';
  }).join('');

  document.getElementById('main').innerHTML=
    '<div class="ph"><div><h1>Comparador de Activos</h1>'+
    '<p class="sub-txt">// Performance normalizado · Correlación · Sharpe ratio</p></div>'+
    '<div class="ph-right">'+liveBadge()+'</div></div>'+
    '<div style="display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start">'+
    '<div>'+
    '<div class="cb" style="margin-bottom:10px">'+
    '<div class="st"><div class="stbar"></div>Tickers</div>'+
    tickerInputs+
    (COMP.tickers.length<4?'<button onclick="compAddTicker()" class="btn" style="width:100%;margin-top:4px">+ Agregar ticker</button>':'')+
    '<div style="margin-top:12px"><div class="st" style="margin-bottom:7px"><div class="stbar"></div>Período</div><div>'+rangeBtns+'</div></div>'+
    '<button onclick="compLoad()" class="btn-big" style="width:100%;margin-top:14px">'+
    (COMP.loading?'<span style="display:inline-flex;align-items:center;gap:7px"><span class="spin-sm"></span>Cargando...</span>':'⚖️ Comparar →')+'</button>'+
    '</div>'+
    '<div class="cb"><div class="st"><div class="stbar"></div>Pares rápidos</div>'+sugRows+'</div>'+
    '</div>'+
    '<div>'+
    '<div class="cb">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'+
    '<div class="st" style="margin-bottom:0"><div class="stbar"></div>Performance (base 0%)</div>'+
    '<div>'+legend+'</div></div>'+
    chartContent+'</div>'+
    statsContent+'</div></div>';
}

async function compLoad(){
  if(COMP.loading) return;
  COMP.tickers=COMP.tickers.filter(function(t){return t&&t.trim().length>0;});
  if(COMP.tickers.length<2){alert('Selecciona al menos 2 tickers');return;}
  COMP.loading=true;COMP.data={};renderComp();
  var rangeMap={30:'1mo',60:'2mo',90:'3mo',130:'6mo'};
  var rng=rangeMap[COMP.range]||'3mo';
  try{
    var promises=COMP.tickers.map(function(t){
      return fetchHistory(t,rng).then(function(hist){
        if(hist&&hist.length>5){COMP.data[t]=hist;}
        else{COMP.data[t]=genFallback(getLivePrice(t)||100,COMP.range);}
        if(!LIVE[t]) return fetchQuote(t).then(function(q){if(q) LIVE[t]=q;});
      }).catch(function(){COMP.data[t]=genFallback(getLivePrice(t)||100,COMP.range);});
    });
    await Promise.all(promises);
  }catch(e){/* silent */}
  COMP.loading=false;renderComp();
}

async function fetchUsdClpLatam(){

  var isVercelFx=window.location.hostname.includes('vercel.app')||
                 window.location.hostname.includes('magnova.app')||
                 window.location.hostname.includes('magnova-invest');

    try{

      var fxData=await fxRes.json();
      if(fxData&&fxData.usdClp){
        LATAM.usdClp=fxData.usdClp;LATAM.lastUpdate=Date.now();
        try{localStorage.setItem('mv_fx_cache',JSON.stringify({v:fxData.usdClp,ts:Date.now()}));}catch(e){}
        return;
      }
    }catch(e){/* fall through */}
  }
  var urls=[
    'https://api.allorigins.win/raw?url='+encodeURIComponent('https://mindicador.cl/api/dolar'),

      var data=await res.json();
      if(data&&data.serie&&data.serie[0]&&data.serie[0].valor){

      }

  }
}

function calcAPV(){
  var renta=parseFloat((document.getElementById('apv-renta')||{}).value)||30000000;
  var aporte=parseFloat((document.getElementById('apv-aporte')||{}).value)||200000;
  var rentPct=(parseFloat((document.getElementById('apv-rent')||{}).value)||7)/100;
  var anual=aporte*12;
  var tasa=renta>107000000?0.40:renta>80000000?0.35:renta>54000000?0.30:
           renta>43000000?0.25:renta>21000000?0.20:renta>13000000?0.15:
           renta>8000000?0.10:0.04;
  var creditoA=anual*0.15;
  var years=30;
  var fondo=rentPct>0?anual*((Math.pow(1+rentPct,years)-1)/rentPct):anual*years;
  var ahorroTotalA=creditoA*years;
  var ahorroTotalB=fondo*tasa;
  var recommended=tasa>=0.20?'Régimen B — Tu tramo hace el ahorro al retiro mayor':'Régimen A — El crédito del 15% es más conveniente';
  var recColor=tasa>=0.20?'var(--green)':'var(--orange)';
  var el=document.getElementById('apv-results');
  if(!el) return;
  el.innerHTML=
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">'+
    '<div style="background:var(--card2);border:1px solid '+(tasa<0.20?'var(--orange-bd)':'var(--border)')+';border-radius:9px;padding:14px">'+
    '<div style="font-size:13px;font-weight:700;color:var(--white);margin-bottom:8px">Régimen A</div>'+
    '<div style="display:flex;justify-content:space-between;font-size:11px;border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:5px"><span style="color:var(--text2)">Crédito anual</span><span style="font-weight:700;color:var(--green);font-family:\'JetBrains Mono\',monospace">+$'+fmt(Math.round(creditoA))+' CLP</span></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:11px;border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:5px"><span style="color:var(--text2)">Fondo a 30 años</span><span style="font-weight:700;color:var(--white);font-family:\'JetBrains Mono\',monospace">$'+fmt(Math.round(fondo/1e6))+'M CLP</span></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:var(--text2)">Ahorro total</span><span style="font-weight:700;color:var(--green);font-family:\'JetBrains Mono\',monospace">$'+fmt(Math.round(ahorroTotalA/1e6))+'M CLP</span></div>'+
    '</div>'+
