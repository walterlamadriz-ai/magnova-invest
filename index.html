/* ═══════════════════════════════════════════════════════════════════
   FINANCEOS INVEST — Sistema de diseño alineado con FinanceOS Pro

   ═══════════════════════════════════════════════════════════════════ */

/* Fonts loaded async via <link> in <head> — no render-blocking @import */

/* ── TOKENS ── */
:root {
  /* Colores — modo claro (idéntico a FinanceOS light) */
  --grn:       #1a6b4a;
  /* Verde para superficies solidas que llevan texto blanco. En claro coincide
     con --grn; en oscuro --grn es brillante (#22c55e) y el blanco encima solo
     alcanza 2.28:1, asi que ahi diverge. */
  --grn-solid: #1a6b4a;
  --grn-bg:    #e8f5ef;
  --grn-lt:    #d0eddf;
  --grn-d:     #145538;

  --red:       #c0392b;
  --red-bg:    #fdf0ee;
  --red-lt:    #f8d7d3;

  --amber:     #b45309;
  --amber-bg:  #fef3c7;

  /* Aliases usados en JS inline styles */
  --green:     #1a6b4a;
  --orange:    #d97706;
  --orange-bg: #fff7ed;
  --orange-bd: #fed7aa;

  --blue:      #1d4ed8;
  --blue-bg:   #eff6ff;

  /* Superficies */
  --bg:        #f7f8f9;
  --bg2:       #ffffff;
  --card:      #ffffff;
  --card2:     #f7f8f9;
  --card3:     #f0f1f3;
  --card4:     #e8eaed;

  /* Texto */
  --text:      #374151;
  --text2:     #6b7280;
  --text3:     #6b7280; /* era #9ca3af = 2.39:1, fallaba AA en 313 usos */
  --bright:    #111827;
  --white:     #ffffff;

  /* Bordes — idéntico a FinanceOS (.07 / .13) */
  --border:    rgba(0,0,0,0.07);
  --border2:   rgba(0,0,0,0.11);
  --border3:   rgba(0,0,0,0.16);

  /* Sombras */
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.10), 0 4px 8px rgba(0,0,0,.05);

  /* Espaciado */
  --r-sm:  6px;
  --r-md:  10px;
  --r-lg:  14px;
  --r-xl:  20px;

  /* Sidebar */
  --sb-w:  256px;
}

/* ── DARK MODE ── */
[data-theme="dark"] {
  --grn:       #22c55e;
  --grn-solid: #177a4a; /* blanco encima = 5.36:1 (sobre --grn seria 2.28:1) */
  --grn-bg:    #052e16;
  --grn-lt:    #14532d;
  --grn-d:     #4fd48a;

  --red:       #f87171;
  --red-bg:    #2a120f;
  --red-lt:    #3d1a16;

  --amber:     #f59e0b;
  --amber-bg:  #2d1f05;

  /* Aliases dark mode */
  --green:     #3dbe7a;
  --orange:    #f59e0b;
  --orange-bg: #1c1500;
  --orange-bd: #3d2e00;

  --blue:      #60a5fa;
  --blue-bg:   #0f1f3d;

  --bg:        #0c0f16;
  --bg2:       #111520;
  --card:      #161b27;
  --card2:     #1a2032;
  --card3:     #1f263c;
  --card4:     #2a3347;

  --text:      #9ca8bc;
  --text2:     #8794a5; /* era #6b7a8f = 3.94:1 sobre card, fallaba AA */
  --text3:     #7b8798; /* era #475569 = 2.27:1 sobre card, fallaba AA */
  --bright:    #e2e8f0;
  --white:     #f1f5f9;

  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.11);
  --border3:   rgba(255,255,255,0.16);

  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.5);
}

/* ── RESET ── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { font-size:14px; -webkit-text-size-adjust:100%; }

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh; min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  transition: background .2s, color .2s;
}

/* ── LAYOUT ── */
.app { display:flex; min-height: 100vh; min-height: 100dvh; }

/* Pre-auth: hide sidebar + topbar so welcome screen is full-width */
body.no-auth .sb { display: none !important; }
body.no-auth #topbar { display: none !important; }
body.no-auth .main { margin-left: 0 !important; margin-top: 0 !important; }

/* ── SIDEBAR ── */
.sb {
  width: var(--sb-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  height: 100vh; height: 100dvh;
  overflow-y: auto;
  z-index: 100;
}

.logo {
  height: 56px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.logo-icon {
  width: 34px; height: 34px;
  background: var(--grn);
  border-radius: 8px;
  display: flex; align-items:center; justify-content:center;
  font-size: 13px; font-weight: 700;
  color: #fff;
  letter-spacing: .5px;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(34,197,94,.35);
}
.logo-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--bright);
  line-height: 1;
}
.logo-name-invest { color: var(--grn); font-weight: 700; }

.sb-section { padding: 0 10px; margin-bottom: 4px; }
.sb-section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text3);
  padding: 18px 4px 8px;
  display: block;
}


.sb-footer {
  margin-top: auto;
  padding: 12px;
  border-top: 0.5px solid var(--border);
}
.sb-user {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 6px;
  border-radius: var(--r-sm);
}
.sb-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--grn-bg);
  border: 1.5px solid var(--grn-lt);
  display: flex; align-items:center; justify-content:center;
  font-size: 11px; font-weight: 600;
  color: var(--grn);
  flex-shrink: 0;
}
.sb-user-name { font-size: 11px; font-weight: 600; color: var(--bright); }
.sb-user-plan {
  font-size: 9px;
  color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
}

/* ── MAIN CONTENT ── */
.main {
  margin-left: var(--sb-w);
  flex: 1;
  min-height: 100vh; min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-bottom: 48px;
}

/* ── PAGE HEADER ── */
.ph {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 24px 28px 20px;
  gap: 16px;
  flex-wrap: wrap;
}
.ph-crumb {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text3);
  margin-bottom: 6px;
}
.ph h1 {
  font-size: 24px;
  font-weight: 700;
  color: var(--bright);
  letter-spacing: -.5px;
  line-height: 1.1;
  margin: 0 0 4px;
}
.sub-txt {
  font-size: 11px;
  color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
  margin: 0;
  line-height: 1.5;
}
.ph-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  flex-shrink: 0;
  padding-top: 4px;
}

/* ── PAGE BODY ── */
.page-body {
  padding: 24px 28px;
  flex: 1;
}

/* ── KPI CARDS ── */
.krow {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}
.kpi {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
}
.kl {
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text3);
  margin-bottom: 6px;
}
.kv {
  font-size: 20px;
  font-weight: 600;
  color: var(--bright);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.5px;
}
.ks {
  font-size: 11px;
  margin-top: 3px;
  font-family: 'JetBrains Mono', monospace;
}
.ks.pos { color: var(--grn); }
.ks.neg { color: var(--red); }
.ks.neu { color: var(--text3); }

/* KPI color accents — borde izquierdo sutil */
.kg { border-left: 2px solid var(--grn); }
.kr { border-left: 2px solid var(--red); }
.ka { border-left: 2px solid var(--amber); }
.kb { border-left: 2px solid var(--blue); }
/* Rail neutro: para datos sin estado semántico (una magnitud no es "positiva") */
.kn { border-left: 2px solid var(--border2); }
/* Jerarquía 1 respuesta -> 3 apoyos */
.krow-hero {
  display: grid;
  grid-template-columns: 1.7fr 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.kpi.hero { padding: 18px 20px; }
.kpi.hero .kl { font-size: 11px; }
.kpi.hero .kv { font-size: 34px; line-height: 1.1; }
.kpi.hero .ks { font-size: 12px; margin-top: 5px; }
@media (max-width: 900px) { .krow-hero { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .krow-hero { grid-template-columns: 1fr; } }

/* ── CARD BOX ── */
.cb {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
}

/* ── SECTION TITLE ── */
.st {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text3);
  margin-bottom: 14px;
}
.stbar {
  width: 3px; height: 12px;
  background: var(--grn);
  border-radius: 2px;
  flex-shrink: 0;
}

/* ── TABLE ── */
.tw {
  border: 0.5px solid var(--border2);
  border-radius: var(--r-lg);
  overflow-x: auto;
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
}
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
thead th {
  text-align: left;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text3);
  background: var(--card2);
  border-bottom: 0.5px solid var(--border2);
  white-space: nowrap;
}
td {
  padding: 9px 14px;
  font-size: 12px;
  border-bottom: 0.5px solid var(--border);
  font-variant-numeric: tabular-nums;
  color: var(--text);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
.trow:hover td { background: var(--card3); }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px;
  border-radius: var(--r-sm);
  border: 0.5px solid var(--border2);
  background: var(--card);
  color: var(--text2);
  font-size: 12px;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: border-color .12s cubic-bezier(.23,1,.32,1),
              color .12s cubic-bezier(.23,1,.32,1),
              background-color .12s cubic-bezier(.23,1,.32,1);
  white-space: nowrap;
}
.btn:hover {
  border-color: var(--grn);
  color: var(--grn);
  background: var(--grn-bg);
}
.btn-big {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border-radius: var(--r-sm);
  border: none;
  background: var(--grn);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: background .12s, transform .1s;
  white-space: nowrap;
}
.btn-big:hover { background: var(--grn-d); transform: translateY(-1px); }
.btn-big:active { transform: translateY(0); }
.btn-big:disabled { opacity:.5; cursor:not-allowed; transform:none; }

/* ── INPUTS ── */
.inp {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-sm);
  padding: 7px 10px;
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  color: var(--bright);
  outline: none;
  transition: border-color .12s;
  width: 100%;
}
.inp:focus { border-color: var(--grn); box-shadow: 0 0 0 3px var(--grn-bg); }

/* ── BADGES ── */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .3px;
  font-family: 'JetBrains Mono', monospace;
}
.badge.buy  { background: var(--grn-bg); color: var(--grn); }
.badge.hold { background: var(--amber-bg); color: var(--amber); }
.badge.sell { background: var(--red-bg); color: var(--red); }

/* ── LIVE BADGE ── */
.live-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 500;
  font-family: 'JetBrains Mono', monospace;
  background: var(--grn-bg);
  color: var(--grn);
  border: 0.5px solid var(--grn-lt);
}
.live-badge.loading { background: var(--amber-bg); color: var(--amber); border-color: #fde68a; }
.live-badge.error   { background: var(--red-bg);   color: var(--red);   border-color: var(--red-lt); }
.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse-dot 2s ease infinite;
}
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── SCORE BAR ── */
.score-bar {
  height: 3px;
  background: var(--card3);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}
.score-fill {
  height: 100%;
  border-radius: 2px;
  transition: width .4s ease;
}
.score-fill.high { background: var(--grn); }
.score-fill.mid  { background: var(--amber); }
.score-fill.low  { background: var(--red); }

/* ── TABS ── */
.tabs {
  display: flex;
  gap: 2px;
  margin-bottom: 18px;
  border-bottom: 0.5px solid var(--border2);
}
.tab-btn {
  padding: 8px 14px;
  border: none;
  background: transparent;
  color: var(--text3);
  font-size: 12px;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -0.5px;
  transition: color .12s, border-color .12s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.act {
  color: var(--grn);
  border-bottom-color: var(--grn);
}

/* ── MODAL / OVERLAY ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  padding: 20px;
  backdrop-filter: blur(4px);
}
.modal {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-xl);
  padding: 28px;
  max-width: 480px;
  width: 100%;
  box-shadow: var(--shadow-lg);
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}
.modal h2 {
  font-size: 17px;
  font-weight: 600;
  color: var(--bright);
  margin-bottom: 6px;
  letter-spacing: -.3px;
}
.modal .modal-sub, .modal .msub {
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 22px;
  line-height: 1.5;
}
/* .ifu — modificador de input a ancho completo (siempre usado como "inp ifu") */
.inp.ifu { width: 100%; box-sizing: border-box; }
.modal-close {
  position: absolute;
  top: 16px; right: 16px;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 0.5px solid var(--border2);
  background: var(--card2);
  color: var(--text2);
  cursor: pointer;
  display: flex; align-items:center; justify-content:center;
  font-size: 14px;
  transition: background .12s;
}
.modal-close:hover { background: var(--red-bg); color: var(--red); }

/* ── DRAWER ── */
.dov {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.2);
  z-index: 200;
  backdrop-filter: blur(2px);
}
.drw {
  position: fixed;
  top: 0; right: -440px;
  width: 420px;
  max-width: 100%;
  height: 100vh; height: 100dvh;
  background: var(--card);
  border-left: 0.5px solid var(--border2);
  z-index: 201;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
  transition: right .25s cubic-bezier(.4,0,.2,1);
  overflow: visible;
}
.drw.open { right: 0; }
@media (max-width: 480px) {
  .drw {
    top: auto;
    bottom: -92vh;
    right: 0; left: 0;
    width: 100%;
    height: 92vh;
    border-left: none;
    border-radius: 16px 16px 0 0;
    border-top: 1px solid var(--border);
    transition: bottom .3s cubic-bezier(.4,0,.2,1);
  }
  .drw.open { bottom: 0; right: 0; }
  .drw::before {
    content: '';
    display: block;
    width: 36px; height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin: 10px auto 0;
    flex-shrink: 0;
  }
}
.drw.open ~ .dov { display: block; }
.drwh {
  padding: 18px 20px;
  border-bottom: 0.5px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.drwb {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px;
}

/* ── SPINNER ── */
.spin {
  width: 20px; height: 20px;
  border: 2px solid var(--border2);
  border-top-color: var(--grn);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
.sk-pulse {
  background: linear-gradient(90deg, var(--card2) 25%, var(--card3,#2a2a3a) 50%, var(--card2) 75%);
  background-size: 200% 100%;
  animation: sk-shimmer 1.4s infinite;
}
@keyframes sk-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@keyframes sk-dot {
  from { opacity: .3; transform: scale(.8); }
  to   { opacity: 1;  transform: scale(1.2); }
}
.spin-sm {
  width: 12px; height: 12px;
  border-width: 1.5px;
  border: 1.5px solid var(--border2);
  border-top-color: var(--grn);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── SKELETON LOADER ── */
.skel {
  background: linear-gradient(90deg, var(--card3) 25%, var(--card4) 50%, var(--card3) 75%);
  background-size: 200% 100%;
  animation: skel-load 1.4s ease infinite;
  border-radius: 4px;
}
@keyframes skel-load { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
@keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.9} }

/* ── GRID LAYOUTS ── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.g-sidebar { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
.dload {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 40px;
  color: var(--text3); font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
}

/* ── SKELETON SCREENS ── */
@keyframes skel-shimmer {
  0%   { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
.skel-line {
  border-radius: 4px;
  background: linear-gradient(90deg, var(--card3) 25%, var(--card2) 50%, var(--card3) 75%);
  background-size: 800px 100%;
  animation: skel-shimmer 1.4s ease-in-out infinite;
}
.skel-card {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
}
/* ── DISCLAIMER LEGAL ── */
.disclaimer-bar {
  position: fixed;
  bottom: 0;
  left: var(--sb-w);
  right: 0;
  z-index: 200;
  background: var(--amber-bg);
  border-top: 0.5px solid rgba(180,83,9,.15);
  padding: 8px 28px;
  font-size: 10px;
  color: var(--amber);
  font-family: 'JetBrains Mono', monospace;
  line-height: 1.5;
}

/* ── ALERT SAAS GRID ── */
.mgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  margin-top: 4px;
}
.mc {
  background: var(--card2);
  border: 0.5px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px;
}

/* ── WELCOME / LOGIN ── */
.welcome-wrap {
  min-height: 100vh; min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--bg);
  padding: 0 24px 40px;
}
.welcome-hero {
  width: 100%;
  max-width: 900px;
  padding: 64px 0 40px;
  text-align: center;
}
.welcome-hero h1 {
  font-size: clamp(28px, 5vw, 52px);
  font-weight: 700;
  color: var(--bright);
  letter-spacing: -.03em;
  line-height: 1.15;
  margin-bottom: 14px;
}
.welcome-hero h1 span { color: var(--grn); }
.welcome-hero p {
  font-size: 16px;
  color: var(--text2);
  line-height: 1.65;
  max-width: 520px;
  margin: 0 auto 32px;
}
.welcome-feats {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 48px;
}
.welcome-feat {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-lg);
  padding: 20px 22px;
  max-width: 220px;
  text-align: left;
  box-shadow: var(--shadow-sm);
}
.welcome-feat-icon { font-size: 22px; margin-bottom: 10px; }
.welcome-feat h3 { font-size: 13px; font-weight: 600; color: var(--bright); margin-bottom: 5px; }
.welcome-feat p { font-size: 12px; color: var(--text2); line-height: 1.5; margin: 0; }
.welcome-plans {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 48px;
}
.welcome-plan {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: var(--r-lg);
  padding: 22px 24px;
  min-width: 200px;
  text-align: center;
}
.welcome-plan.featured {
  border-color: var(--grn);
  background: var(--grn-bg);
}
.welcome-plan-name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); margin-bottom: 8px; }
.welcome-plan.featured .welcome-plan-name { color: var(--grn); }
.welcome-plan-price { font-size: 28px; font-weight: 700; color: var(--bright); letter-spacing: -.02em; }
.welcome-plan-price sup { font-size: 14px; font-weight: 500; }
.welcome-plan-price small { font-size: 13px; font-weight: 400; color: var(--text2); }
.welcome-plan-desc { font-size: 12px; color: var(--text2); margin: 8px 0 0; line-height: 1.5; }
.welcome-box {
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-xl);
  padding: 40px 36px;
  max-width: 380px;
  width: 100%;
  box-shadow: var(--shadow-md);
}
.welcome-wrap-b {
  min-height: 100vh; min-height: 100dvh;
  display: grid;
  grid-template-columns: 1fr;
  align-items: start;
  background: var(--bg);
  padding: 40px 24px 48px;
  gap: 32px;
  max-width: 1000px;
  margin: 0 auto;
  width: 100%;
}
@media(min-width:768px){
  .welcome-wrap-b { grid-template-columns: 3fr 2fr; gap: 48px; align-items: center; }
}
.welcome-col-left { display: flex; flex-direction: column; }
.welcome-col-right { display: flex; flex-direction: column; }
.welcome-ctx-cards { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
.welcome-ctx-card {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  min-width: 110px;
  flex: 1;
}
.welcome-logo {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 28px;
}
.welcome-icon {
  width: 36px; height: 36px;
  background: var(--grn);
  border-radius: var(--r-sm);
  display: flex; align-items:center; justify-content:center;
  font-size: 13px; font-weight: 700;
  color: #fff;
}
.welcome-title {
  font-size: 17px; font-weight: 600;
  color: var(--bright); letter-spacing: -.3px;
}
.welcome-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }

/* ── WELCOME v3 ────────────────────────────────────────── */
.wv3-outer{min-height: 100vh; min-height: 100dvh;display:flex;flex-direction:column;background:var(--bg)}
.wv3-wrap{flex:1;display:grid;grid-template-columns:1fr;gap:32px;align-items:center;padding:28px 24px 20px;max-width:1100px;margin:0 auto;width:100%}
@media(min-width:900px){.wv3-wrap{grid-template-columns:3fr 2fr;gap:48px;padding:32px 40px 24px}}
.wv3-left{display:flex;flex-direction:column;gap:22px;max-width:560px}
.wv3-right{display:flex;flex-direction:column;align-items:center}
.wv3-badge{display:inline-flex;align-items:center;gap:7px;background:var(--grn-bg);border:1px solid var(--grn-lt);border-radius:20px;padding:4px 13px;align-self:flex-start}
.wv3-badge span{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--grn);letter-spacing:.5px}
.wv3-dot{width:6px;height:6px;border-radius:50%;background:var(--grn);flex-shrink:0;animation:wv3pulse 2s ease-in-out infinite}
@keyframes wv3pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.wv3-h1{font-size:clamp(28px,4.5vw,46px);font-weight:700;color:var(--bright);letter-spacing:-.03em;line-height:1.15;margin:0}
.wv3-sub{font-size:15px;color:var(--text2);line-height:1.7;max-width:480px;margin:0}
.wv3-ctx-label{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.wv3-ctx-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wv3-ctx-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.wv3-ctx-ttl{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.wv3-ctx-val{font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:6px}
.wv3-ctx-hint{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text3);margin-top:2px}
.wv3-scores-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wv3-score-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.wv3-score-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.wv3-score-ticker{font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--bright)}
.wv3-score-circle{width:34px;height:34px;border-radius:50%;border:1px solid;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.wv3-score-rsi{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text2);margin-bottom:3px}
.wv3-score-smas{display:flex;gap:8px;font-size:9px;font-family:'JetBrains Mono',monospace}
.wv3-scores-note{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text3);margin-top:6px}
.wv3-feats{display:flex;flex-direction:column;gap:12px}
.wv3-feat{display:flex;align-items:flex-start;gap:10px}
.wv3-feat-icon{font-size:17px;flex-shrink:0;margin-top:1px}
.wv3-feat-title{font-size:13px;font-weight:600;color:var(--bright);margin-bottom:2px}
.wv3-feat-desc{font-size:12px;color:var(--text2);line-height:1.5}
.wv3-disc{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text3);line-height:1.7}
.wv3-auth-card{background:var(--card);border:0.5px solid var(--border2);border-radius:20px;padding:28px 28px 24px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.wv3-auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.wv3-auth-icon{width:34px;height:34px;border-radius:8px;background:var(--grn-solid);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.wv3-auth-name{font-size:15px;color:var(--text)}
.wv3-auth-name b{color:var(--grn);font-weight:700}
.wv3-tabs{display:grid;grid-template-columns:1fr 1fr;position:relative;background:var(--bg2);border-radius:10px;padding:4px;margin-bottom:20px}
.wv3-tab-slider{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);background:var(--card);border-radius:7px;box-shadow:0 2px 8px rgba(0,0,0,.28);transition:transform .25s cubic-bezier(.4,0,.2,1);pointer-events:none}
.wv3-tab-slider.r{transform:translateX(calc(100% + 4px))}
.wv3-tab-btn{position:relative;z-index:1;padding:7px 0;font-size:12px;font-weight:500;background:transparent;border:none;cursor:pointer;transition:color .15s;font-family:inherit;width:100%}
.wv3-tab-btn.active{color:var(--bright)}
.wv3-tab-btn:not(.active){color:var(--text2)}
.wv3-panel{display:none;flex-direction:column;gap:13px}
.wv3-panel.show{display:flex}
.wv3-field-label{display:block;font-size:10px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;font-family:'JetBrains Mono',monospace}
.wv3-field-wrap{position:relative}
/* 16px es el minimo que evita que iOS haga zoom al enfocar el campo.
   El padding sube a 12px para que la altura llegue al minimo tactil de 44px. */
.wv3-field-wrap input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:16px;color:var(--bright);outline:none;transition:border-color .15s cubic-bezier(.23,1,.32,1),box-shadow .15s cubic-bezier(.23,1,.32,1);box-sizing:border-box;font-family:inherit}
.wv3-field-wrap input:focus-visible{border-color:var(--grn);box-shadow:0 0 0 3px var(--grn-bg)}
.wv3-field-wrap input::placeholder{color:var(--text3)}
/* padding ampliado para alcanzar el area tactil minima sin cambiar el tamano visual */
.wv3-eye-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text3);padding:14px 10px;line-height:1;min-height:44px;display:flex;align-items:center}
.wv3-eye-btn:hover{color:var(--text)}
.wv3-forgot{text-align:right;margin-top:4px}
.wv3-forgot a{font-size:11px;color:var(--grn);text-decoration:none}
.wv3-forgot a:hover{text-decoration:underline}
.wv3-submit{width:100%;border-radius:10px;padding:11px;font-size:13px;font-weight:600;color:#fff;background:var(--grn-solid);border:none;cursor:pointer;transition:opacity .15s,transform .08s;box-shadow:0 6px 20px -8px var(--grn);font-family:inherit}
.wv3-submit:hover{opacity:.9;transform:translateY(-1px)}
.wv3-submit:active{transform:scale(.98)}
.wv3-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.wv3-err{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--red);display:none;line-height:1.5}
.wv3-legal{font-size:10px;color:var(--text3);text-align:center;line-height:1.6}
.wv3-legal a{color:var(--grn);text-decoration:none;cursor:pointer}
.wv3-legal a:hover{text-decoration:underline}
.wv3-check-row{display:flex;align-items:flex-start;gap:8px;cursor:pointer}
.wv3-check-row input[type=checkbox]{margin-top:2px;width:14px;height:14px;accent-color:var(--grn);flex-shrink:0;cursor:pointer}
.wv3-check-txt{font-size:11px;color:var(--text2);line-height:1.5}
.wv3-check-txt a{color:var(--grn);text-decoration:none;cursor:pointer}
.wv3-pricing{margin-top:14px;text-align:center;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text3);line-height:1.9}
.wv3-pricing .wv3-grn{color:var(--grn)}
.wv3-footer{padding:10px 24px;text-align:center;font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text3)}

.form-label {
  display: block;
  font-size: 11px; font-weight: 500;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: .6px;
  margin-bottom: 6px;
}
.form-group { margin-bottom: 14px; }
.form-error {
  font-size: 11px; color: var(--red);
  margin-top: 6px;
  font-family: 'JetBrains Mono', monospace;
  display: none;
}

/* ── DARK MODE TOGGLE ── */
.theme-toggle {
  width: 32px; height: 18px;
  border-radius: 9px;
  background: var(--border2);
  border: none; cursor: pointer;
  position: relative;
  transition: background .2s;
  flex-shrink: 0;
}
.theme-toggle.on { background: var(--grn); }
.theme-toggle::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #fff;
  transition: transform .2s;
  box-shadow: var(--shadow-sm);
}
.theme-toggle.on::after { transform: translateX(14px); }

/* ── UPGRADE PLAN BADGE ── */
.plan-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 9px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.plan-free  { background: var(--card3); color: var(--text2); }
.plan-trial { background: var(--amber-bg); color: var(--amber); }
.plan-pro   { background: var(--grn-bg); color: var(--grn); }
.plan-teams { background: var(--blue-bg); color: var(--blue); }

/* ── PAYWALL ── */
.paywall {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 400px; text-align: center;
  padding: 40px;
}
.paywall-icon { font-size: 40px; margin-bottom: 16px; }
.paywall h2 { font-size: 18px; font-weight: 600; color: var(--bright); margin-bottom: 8px; }
.paywall p { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 24px; max-width: 360px; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  :root { --sb-w: 0px; }
  .sb {
    transform: translateX(-220px);
    transition: transform .25s cubic-bezier(.4,0,.2,1);
    width: 220px;
    z-index: 400;
  }
  .sb.mobile-open { transform: translateX(0); }
  .main { margin-left: 0; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .ph { padding: 14px 16px 12px; }
  .page-body { padding: 16px; }
  .g2, .g3 { grid-template-columns: 1fr; }
  .g-sidebar { grid-template-columns: 1fr; }
  /* responsive collapse for inline 2-col grids with a fixed px sidebar */
  .resp2 { grid-template-columns: 1fr !important; }
  .resp2 > div[style*="border-right"] { border-right: none !important; }
  .krow { grid-template-columns: repeat(2,1fr); }
  table { font-size: 11px; }
  td, th { padding: 7px 10px; }
  .tw { overflow-x: auto; min-width: 0; }
  /* La tabla de portfolio tiene 11 columnas: a 375px queda ilegible incluso con
     scroll horizontal. En movil se ocultan las secundarias y quedan las 5 que
     responden "¿cuanto tengo y como va?": Activo, Precio, Δ Hoy, P&L y acciones.
     El detalle completo sigue disponible al abrir el activo. */
  .col-sec { display: none; }
  /* permite que los tracks grid 1fr encojan bajo contenido nowrap (evita overflow) */
  .dash-body, .dash-body > div, .dash-wrap, .fos-card, .resp2, .resp2 > div { min-width: 0; }
  .fos-card { overflow-x: auto; }
  /* headers de módulo: que el botón/acción baje de línea en vez de desbordar */
  .fos-module-header { flex-wrap: wrap; gap: 8px; }
  .hbg-btn { display:flex!important; }
  .sb-backdrop { display:block; }
  #mobile-header { display: flex!important; }
  .disclaimer-bar { left: 0; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
  #mob-tab-bar { display: flex!important; }
  /* ph-right: wrap on small screens so buttons don't overflow */
  .ph-right { flex-wrap: wrap; gap: 6px; }
  /* btn-big full width inside modals and locked banners */
  .modal .btn-big, .modal-box .btn-big { width: 100%; }
  /* suite nav: tighten padding */
  body > div:first-child { padding: 6px 12px !important; }
  body > div:first-child a:first-child { display: none; }
}
#mob-tab-bar {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(60px + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg2);
  border-top: 1px solid var(--border);
  z-index: 350;
  align-items: stretch;
}
.mob-tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; flex: 1; cursor: pointer; padding: 0;
  color: var(--text3); font-size: 9px; font-family: 'JetBrains Mono', monospace;
  letter-spacing: .5px; text-transform: uppercase;
  border: none; background: transparent; transition: color .15s;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.mob-tab.act { color: var(--grn); }
.mob-tab.act::before {
  content: '';
  position: absolute;
  top: 5px;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--grn);
}
.mob-tab svg { width: 20px; height: 20px; }
@media (min-width: 769px) {
  #mobile-header { display: none!important; }
  #topbar {
    display: flex!important;
    align-items: center;
    position: fixed;
    top: 0;
    left: var(--sb-w);
    right: 0;
    height: 52px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    gap: 10px;
    z-index: 50;
  }
  .main { margin-top: 52px; }
}
#topbar { display: none; }
.tb-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--bright);
  display: flex;
  align-items: center;
  gap: 8px;
}
.hbg-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: 18px;
  color: var(--text);
  flex-shrink: 0;
}
.sb-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 399;
}
.main { position: relative; }

/* ── TOAST NOTIFICATIONS ── */
#toast-container { position:fixed; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); right:calc(24px + env(safe-area-inset-right, 0px)); z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.toast { display:flex; align-items:center; gap:10px; padding:11px 16px; border-radius:10px; font-size:12px; font-family:'JetBrains Mono',monospace; color:#fff; min-width:220px; max-width:320px; box-shadow:0 4px 20px rgba(0,0,0,.35); opacity:0; transform:translateY(10px); transition:opacity .25s,transform .25s; pointer-events:auto; }
.toast.show { opacity:1; transform:translateY(0); }
.toast.success { background:var(--grn); }
.toast.error { background:#ef4444; }
.toast.info { background:var(--blue); }
.toast.warning { background:var(--amber); }

/* ── @MEDIA PRINT (Radar PDF) ── */
@media print {
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important;color:#1a1a1a!important;font-size:10pt!important}
  .sb,.ph-right,.dov,.drw{display:none!important}
  .main{margin:0!important}
  .cb{break-inside:avoid;page-break-inside:avoid;border:0.5pt solid #ddd!important;border-radius:5pt!important}
  .radar-section{break-inside:avoid;margin-bottom:10pt!important}
  @page{size:A4;margin:18mm 15mm 14mm}
}


/* ── NAV BUTTONS (nb) — sidebar navigation ── */
.nb {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 42px;
  padding: 0 12px 0 10px;
  border-radius: 8px;
  border: none;
  border-left: 2px solid transparent;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  width: 100%;
  text-align: left;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  transition: background .12s, color .12s;
  margin-bottom: 2px;
}
.nb:hover { background: rgba(255,255,255,.05); color: var(--bright); }
.nb.act {
  background: rgba(34,197,94,.1);
  color: var(--grn);
  font-weight: 600;
  border-left-color: var(--grn);
}
.nb.lk { opacity: .5; cursor: not-allowed; }
.nb.lk:hover { background: transparent; color: var(--text2); }
.nb-icon {
  width: 16px;
  text-align: center;
  font-size: 14px;
  flex-shrink: 0;
}
.nb-label { flex: 1; }

/* Iconos de linea. stroke:currentColor hace que hereden el color del estado
   (normal / hover / activo) y del tema sin necesidad de variantes. */
.ico {
  width: 16px; height: 16px;
  flex-shrink: 0;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.nb-icon .ico { margin: 0 auto; }
.ico-lg { width: 22px; height: 22px; }

/* ── FOS PRIMITIVES ── */
.fos-pro-badge {
  display: inline-flex;
  align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: .5px;
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(245,158,11,.12);
  color: var(--amber);
  border: 1px solid rgba(245,158,11,.25);
}
.fos-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  white-space: nowrap;
}
.fos-pill--grn { background: var(--grn-bg); border-color: var(--grn-lt); color: var(--grn); }
.fos-pill--amb { background: var(--card); border-color: var(--border2); color: var(--amber); }
.fos-pill--red { background: rgba(248,113,113,.08); border-color: rgba(248,113,113,.2); color: var(--red); }
.fos-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}

/* ── FOS DESIGN SYSTEM ── */
.fos-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
.fos-section-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.fos-section-label::before { content: ''; display: block; width: 3px; height: 12px; background: var(--grn); border-radius: 2px; }
/* Card section titles — bigger, bolder, white */
.fos-card-title { font-size: 14px; font-weight: 700; color: var(--bright); display: flex; align-items: center; gap: 8px; }
.fos-card-title::before { content: ''; display: block; width: 3px; height: 16px; background: var(--grn); border-radius: 2px; flex-shrink: 0; }
/* Page module header */
.dash-page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; }
.dash-page-breadcrumb { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text3); margin-bottom: 6px; }
.dash-page-title { font-size: 26px; font-weight: 700; color: var(--bright); margin: 0; line-height: 1.1; }
.dash-page-date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text3); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; }
.fos-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.fos-table th { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
.fos-table td { padding: 11px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--text); vertical-align: middle; }
.fos-table tr:last-child td { border-bottom: none; }
.fos-table tr:hover td { background: var(--card3); }
.fos-score { display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;flex-shrink:0; }
.fos-score--g { background:rgba(61,190,122,.15);color:var(--grn);border:1px solid rgba(61,190,122,.3); }
.fos-score--a { background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25); }
.fos-score--r { background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25); }
.fos-module-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 24px 28px 20px; gap: 16px; flex-wrap: wrap; }
.fos-module-title { font-size: 24px; font-weight: 700; color: var(--bright); margin: 0 0 4px; line-height: 1.1; letter-spacing: -.5px; }
.fos-module-crumb { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text3); margin-bottom: 6px; }
.fos-module-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text3); margin: 0; line-height: 1.5; }
/* ── DASHBOARD v2 ── */
.dash-wrap { padding: 20px 24px; }
.dash-kpi { display: grid; grid-template-columns: repeat(5,1fr); gap: 12px; margin-bottom: 20px; }
.dash-body { display: grid; grid-template-columns: 1fr 272px; gap: 16px; align-items: start; }
.dash-kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
.dash-kpi-card.kpi-pos { border-top: 2px solid var(--grn); }
.dash-kpi-card.kpi-neg { border-top: 2px solid var(--red); }
.dash-kpi-card.kpi-neu { border-top: 2px solid var(--border2); }
.dash-kpi-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
.dash-kpi-val { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; color: var(--bright); line-height: 1; margin-bottom: 6px; }
.dash-kpi-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
.dash-ctx-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.dash-ctx-loading { font-size: 11px; color: var(--text3); font-family: 'JetBrains Mono', monospace; padding: 12px 0; }
.dash-regime-pill { display: inline-flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 999px; margin: 8px 0 6px; }
.dash-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dash-action-btn { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; cursor: pointer; text-align: left; transition: border-color .15s; }
.dash-action-btn:hover { border-color: var(--grn-lt); }
@media (max-width: 1100px) { .dash-kpi { grid-template-columns: repeat(3,1fr); } }
@media (max-width: 900px) { .dash-body { grid-template-columns: 1fr; } }
@media (max-width: 768px) {
  .dash-kpi { grid-template-columns: 1fr 1fr; }
  .dash-wrap { padding: 14px 16px; }
  /* KPI: número en una línea sin recortarse (override DESPUÉS de la base) */
  .dash-kpi-card { min-width: 0; overflow: hidden; padding: 12px 10px; }
  .dash-kpi-val { font-size: 15px; white-space: nowrap; letter-spacing: -0.4px; }
}

/* ── USER PILL ── */
.ua-pill {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 8px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: background .12s;
  margin-top: 4px;
}
.ua-pill:hover { background: var(--card2); }
.ua-av {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--grn-bg);
  border: 1.5px solid var(--grn-lt);
  display: flex; align-items:center; justify-content:center;
  font-size: 11px; font-weight: 600;
  color: var(--grn);
  flex-shrink: 0;
}
.ua-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--bright);
}
.ua-plan {
  font-size: 9px;
  color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
}

/* ── PAGE BODY PADDING ── */
#main > *:not(.ph) { padding: 0; }
.page-body, #main > div { }

/* content padding */
#main > div:not(.ph) { padding: 20px 28px; }

/* ── DRAWER INNER COMPONENTS ── */
.sigb {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--border2);
  background: var(--card2); margin-bottom: 14px;
}
.sigb.buy  { border-color: var(--gborder); background: var(--gbg); }
.sigb.sell { border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.08); }
.sigb.hold { border-color: var(--amborder); background: var(--ambg); }

.cha { margin-bottom: 14px; overflow: hidden; border-radius: 8px; }
.chl {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .7px; color: var(--text3);
  font-family: 'JetBrains Mono', monospace; margin-bottom: 8px;
}

/* Tab buttons — chart / RSI / MACD / Fundamentals */
.dtab, .rtab {
  padding: 5px 11px;
  border: 1px solid var(--border2);
  border-radius: 6px;
  background: var(--card2);
  color: var(--text2);
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
  white-space: nowrap;
}
.dtab:hover, .rtab:hover { border-color: var(--orange-bd); color: var(--amber); }
.dtab.on { background: var(--orange-bg); color: var(--amber); border-color: var(--orange-bd); font-weight: 700; }
.rtab.on { background: var(--gbg); color: var(--grn); border-color: var(--gborder); font-weight: 700; }
div:has(>.dtab), div:has(>.rtab) {
  display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px;
}

/* Indicator 2-column grid (RSI / MACD panels) */
.ind2 {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-bottom: 14px;
}
.icard {
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px;
}
.icl { font-size: 9px; color: var(--text3); text-transform: uppercase;
  letter-spacing: .6px; font-family: 'JetBrains Mono', monospace; margin-bottom: 3px; }
.icv { font-size: 17px; font-weight: 700; color: var(--bright); line-height: 1.2; }
.ics { font-size: 9px; color: var(--text3); margin-top: 3px; font-family: 'JetBrains Mono', monospace; }

/* Fundamentals 2-column grid */
.fund3 {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 6px; margin-bottom: 14px;
}
.fi {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 10px; border-radius: 6px;
  background: var(--card2); border: 1px solid var(--border);
}
.fl2 { font-size: 9px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }
.fv  { font-size: 12px; font-weight: 600; color: var(--bright); }

/* Modal close button */
.mx {
  position: absolute; top: 14px; right: 14px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--card2); border: 1px solid var(--border);
  color: var(--text2); font-size: 14px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .12s, color .12s;
}
.mx:hover { background: rgba(239,68,68,.15); color: #ef4444; border-color: rgba(239,68,68,.4); }

/* Button variants */
.btn-up {
  padding: 6px 14px; border-radius: var(--r-sm);
  background: var(--orange-bg); border: 1px solid var(--orange-bd);
  color: var(--amber); font-size: 11px; font-weight: 700;
  font-family: 'Inter', sans-serif; cursor: pointer;
  transition: background .12s;
}
.btn-up:hover { background: var(--amber); color: #fff; }
.btn-r {
  padding: 6px 14px; border-radius: var(--r-sm);
  background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.3);
  color: #ef4444; font-size: 11px; font-family: 'Inter', sans-serif;
  cursor: pointer; transition: background .12s;
}
.btn-r:hover { background: rgba(239,68,68,.18); }

/* Mobile: small screen polish */
@media (max-width: 480px) {
  .drwb { padding: 14px; }
  .drwh { padding: 14px; }
  .ind2 { grid-template-columns: 1fr; }
  .fund3 { grid-template-columns: 1fr; }
  .dtab { font-size: 10px; padding: 4px 8px; }
  /* Full-width CTAs everywhere on small screens */
  .btn-big { width: 100%; justify-content: center; }
  /* krow single column on very small screens */
  .krow { grid-template-columns: 1fr 1fr; }
  /* ph wraps instead of overflowing */
  .ph { flex-wrap: wrap; gap: 8px; }
  .ph-right { width: 100%; justify-content: flex-start; }
}

/* ── AREA TACTIL ─────────────────────────────────────────────────
   Los botones de accion de tabla usan padding:2px inline y quedan muy por
   debajo del minimo tactil de 44px. Solo se agrandan en dispositivos de puntero
   grueso: en escritorio con raton la densidad se conserva intacta.
   No se usa la tecnica de area invisible ampliada porque estos botones van
   adyacentes (editar junto a borrar) y las areas se solaparian: el usuario
   pulsaria borrar apuntando a editar. */
@media (pointer: coarse) {
  .btn, .wv3-eye-btn { min-height: 44px; }
}

/* ── INDICADOR DE FOCO ───────────────────────────────────────────
   Varios controles declaran outline:none inline dentro de plantillas JS, lo que
   deja a quien navega con teclado sin saber donde esta. Una regla normal no los
   alcanza (inline gana), asi que se restaura con !important sobre :focus-visible
   — solo se ve al navegar con teclado, no al hacer clic con el raton. */
:focus-visible {
  outline: 2px solid var(--grn) !important;
  outline-offset: 2px !important;
  border-radius: inherit;
}

/* ── MOVIMIENTO REDUCIDO ─────────────────────────────────────────
   Se usa !important a proposito: es lo unico que tambien neutraliza las
   transiciones declaradas inline (style="...transition:.15s") dentro de las
   plantillas JS, que no se pueden alcanzar desde una hoja de estilos normal.
   No se anula la animacion por completo: se conservan los cambios de opacidad
   (ayudan a comprender el cambio de estado) y solo se elimina el movimiento. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
  .spin, .spin-sm { animation: none !important; }
}
</style>

function realizedPnlFor(ticker){
  var avgCost=null,shares=0,realized=0,buyCosts=[];
  S.trades.filter(function(t){return t.ticker===ticker;}).sort(function(a,b){return a.id-b.id;}).forEach(function(t){
    if(t.type==='buy'){buyCosts.push({qty:t.qty,price:t.amount/t.qty});shares+=t.qty;}
    else if(t.type==='sell'){var cost=buyCosts.length?buyCosts.reduce(function(s,b){return s+b.price*b.qty;},0)/buyCosts.reduce(function(s,b){return s+b.qty;},0):0;realized+=(t.amount/t.qty-cost)*t.qty;shares-=t.qty;}
  });
  return realized;
}

// localStorage API cache — 20 min TTL, keyed by url
var _API_CACHE_TTL=20*60*1000;
function _cacheGet(key){
  try{
    var raw=localStorage.getItem('_apic_'+key);
    if(!raw) return null;
    var o=JSON.parse(raw);
    if(Date.now()-o.ts>_API_CACHE_TTL){localStorage.removeItem('_apic_'+key);return null;}
    return o.data;
  }catch(e){return null;}
}
function _cacheSet(key,data){
  try{
    var full='_apic_'+key;
    localStorage.setItem(full,JSON.stringify({ts:Date.now(),data:data}));
    // LRU eviction: keep at most 30 _apic_ keys; remove oldest first
    var keys=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('_apic_'))keys.push(k);}
    if(keys.length>30){
      var sorted=keys.map(function(k){try{return{k:k,ts:JSON.parse(localStorage.getItem(k)).ts};}catch(e){return{k:k,ts:0};}});
      sorted.sort(function(a,b){return a.ts-b.ts;});
      sorted.slice(0,sorted.length-30).forEach(function(e){localStorage.removeItem(e.k);});
    }
  }catch(e){}
}

function fetchWithTimeout(url,ms){
  ms=ms||8000;
  return new Promise(function(resolve,reject){
    var ctrl=new AbortController();
    var timer=setTimeout(function(){ctrl.abort();reject(new Error('Timeout '+ms+'ms'));},ms);
    fetch(url,{signal:ctrl.signal}).then(function(r){clearTimeout(timer);resolve(r);}).catch(function(e){clearTimeout(timer);reject(e);});
  });
}

         volume:m.regularMarketVolume||0,marketCap:0,high52:m.fiftyTwoWeekHigh||price*1.2,
         low52:m.fiftyTwoWeekLow||price*0.8,currency:m.currency||'USD'};

// fetchHistory — OHLCV history via /api/history edge function
async function fetchHistory(ticker,range){
  try{
    var r=range||'3mo';
    var ckey='h_'+ticker+'_'+r;
    // 1. In-memory cache (fastest path)
    var cached=_cacheGet(ckey);
    if(cached){fetchStats.ok++;return cached;}
    // 2. localStorage cache — survives page reload, 5-min TTL
    try{
      var lsKey='fh_'+ticker+'_'+r;
      var stored=localStorage.getItem(lsKey);
      if(stored){
        var parsed=JSON.parse(stored);
        if(parsed&&parsed.ts&&(Date.now()-parsed.ts)<300000&&parsed.data&&parsed.data.length>5){
          _cacheSet(ckey,parsed.data);fetchStats.ok++;return parsed.data;
        }
      }
    }catch(e){}
    // 3. Network fetch
    var res;
    if(_USE_EDGE){
      res=await fetchWithTimeout('/api/history?ticker='+encodeURIComponent(ticker)+'&range='+r+'&interval=1d',8000);
    } else {
      var rawUrl='https://query1.finance.yahoo.com/v8/finance/chart/'+ticker+'?interval=1d&range='+r+'&includePrePost=false';
      res=await fetchWithTimeout('https://api.allorigins.win/raw?url='+encodeURIComponent(rawUrl),9000);
    }
    if(!res||!res.ok) throw new Error('HTTP '+(res?res.status:'no response'));
    var json=await res.json();
    var data;
    if(_USE_EDGE){
      // /api/history returns {ticker,range,interval,data:[{date,open,high,low,close,volume}]}
      if(!json.data||!json.data.length) throw new Error('no data');
      data=json.data.map(function(d,i){
        return {date:new Date(d.date).toLocaleDateString('es-CL',{month:'short',day:'numeric'}),
                ts:Math.floor(new Date(d.date).getTime()/1000),
                open:d.open,high:d.high,low:d.low,close:d.close,vol:d.volume,p:i+1};
      }).filter(function(d){return d.close>0;});
    } else {
      // raw Yahoo Finance format
      var result=json.chart&&json.chart.result&&json.chart.result[0];
      if(!result||!result.timestamp) throw new Error('no result');
      var ts=result.timestamp;
      var q2=result.indicators&&result.indicators.quote&&result.indicators.quote[0];
      if(!q2) throw new Error('no quote');
      data=[];
      for(var i=0;i<ts.length;i++){
        if(q2.close[i]!=null&&q2.close[i]>0){
          data.push({date:new Date(ts[i]*1000).toLocaleDateString('es-CL',{month:'short',day:'numeric'}),
                     open:q2.open[i]||q2.close[i],high:q2.high[i]||q2.close[i],
                     low:q2.low[i]||q2.close[i],close:q2.close[i],vol:q2.volume[i]||0,p:i+1});
        }
      }
    }
    if(!data||data.length<5) throw new Error('insufficient data');
    _cacheSet(ckey,data);
    // Persist to localStorage so next page load is instant
    try{localStorage.setItem('fh_'+ticker+'_'+r,JSON.stringify({ts:Date.now(),data:data}));}catch(e){}
    fetchStats.ok++;fetchStats.lastOk=Date.now();
    return data;
  }catch(e){fetchStats.fail++;fetchStats.lastErr=e.message;return null;}
}

async function refreshLive(tickers,manual){
  if(liveLoading&&!manual) return;
  if(_liveAbortCtrl) _liveAbortCtrl.abort();
  _liveAbortCtrl=new AbortController();
  var mySignal=_liveAbortCtrl.signal;
  liveLoading=true;
  liveFailed=false;
  // Spinner on all refresh buttons
  document.querySelectorAll('.refresh-btn').forEach(function(b){
    b.innerHTML='<span class="spin-sm"></span>';b.disabled=true;
  });
  try{
    var gotAny=false;
    var isVercel=_USE_EDGE;

    if(isVercel){
      // ONE request for all tickers via our Edge Function
      try{
        var batchRes=await fetchWithTimeout('/api/quote?ticker='+tickers.join(','),6000);
        var batchData=await batchRes.json();
        Object.keys(batchData).forEach(function(t){
          var q=batchData[t];
          if(q&&q.price){
            LIVE[t]=q;
            S.portfolio.forEach(function(h){if(h.t===t)h.cur=q.price;});
            ALL_SIG.forEach(function(s){if(s.t===t)s.p=q.price;});
            gotAny=true;
          }
        });
        if(mySignal.aborted) return;
        if(gotAny) updateLivePricesInDOM();
      }catch(e){if(mySignal.aborted) return;/* fall through to individual fetches */}
    }

    if(mySignal.aborted) return;
    if(!gotAny){
      // Fallback: individual fetches with batching
      var BATCH_SIZE=6;
      for(var bi=0;bi<tickers.length;bi+=BATCH_SIZE){
        var batch=tickers.slice(bi,bi+BATCH_SIZE);
        var results=await Promise.allSettled(batch.map(function(t){return fetchQuote(t);}));
        results.forEach(function(r,i){
          if(r.status==="fulfilled"&&r.value){
            var t=batch[i];
            LIVE[t]=r.value;
            S.portfolio.forEach(function(h){if(h.t===t)h.cur=r.value.price;});
            ALL_SIG.forEach(function(s){if(s.t===t)s.p=r.value.price;});
            gotAny=true;
          }
        });
        if(gotAny) updateLivePricesInDOM();
      }
    }
    if(gotAny){
      liveUpdated=Date.now();liveFailed=false;liveFromCache=false;
      try{localStorage.setItem('mv_prices_cache',JSON.stringify({ts:Date.now(),live:LIVE}));}catch(e){/* silent */}
    } else {
      liveFailed=true;
      trackError('quotes',new Error('no_prices_returned'),{tickers:tickers.length}); // Yahoo no devolvió precios
      // Load from cache on complete failure
      try{
        var c=JSON.parse(localStorage.getItem('mv_prices_cache')||'null');
        if(c&&(Date.now()-c.ts)<LIVE_CACHE_TTL){
          Object.assign(LIVE,c.live);
          liveFromCache=true;liveUpdated=c.ts;
          S.portfolio.forEach(function(h){if(LIVE[h.t])h.cur=LIVE[h.t].price;});
        }
      }catch(e){/* silent */}
    }
  }catch(e){liveFailed=true;trackError('quotes',e);}
  liveLoading=false;
  // Restore refresh buttons
  var updStr=liveUpdated?new Date(liveUpdated).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):'—';
  document.querySelectorAll('.refresh-btn').forEach(function(b){
    b.innerHTML='↻';b.disabled=false;
    b.title='Actualizado: '+updStr+(liveFailed?' · Error de conexión':liveFromCache?' · Datos cacheados':'');
  });
  updateLiveBadge();
  updateLivePricesInDOM();
}

// ── TI ─────────────────────────────────────────────────────────
var TI={
  sma:function(p,n){return p.map(function(_,i){return i<n-1?null:p.slice(i-n+1,i+1).reduce(function(a,b){return a+b;},0)/n;});},
  ema:function(p,n){var k=2/(n+1),r=[p[0]];for(var i=1;i<p.length;i++)r.push(p[i]*k+r[i-1]*(1-k));return r;},
  rsi:function(p,n){
    n=n||14;if(p.length<n+1)return p.map(function(){return 50;});
    var d=p.slice(1).map(function(v,i){return v-p[i];});
    var g=d.map(function(c){return Math.max(c,0);});
    var l=d.map(function(c){return Math.abs(Math.min(c,0));});
    var ag=g.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
    var al=l.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
    var res=[];for(var j=0;j<=n;j++)res.push(50);
    for(var i=n;i<d.length;i++){ag=(ag*(n-1)+g[i])/n;al=(al*(n-1)+l[i])/n;res.push(al===0?100:100-100/(1+ag/al));}
    return res;
  },
  macd:function(p){
    var e12=this.ema(p,12),e26=this.ema(p,26);
    var line=e12.map(function(v,i){return v-e26[i];});
    var sig=this.ema(line,9);
    return{line:line,signal:sig,hist:line.map(function(v,i){return v-sig[i];})};
  },
  bb:function(p,n,m){
    n=n||20;m=m||2;
    var sma=this.sma(p,n);
    return p.map(function(_,i){
      if(!sma[i])return{mid:null,upper:null,lower:null};
      var sl=p.slice(Math.max(0,i-n+1),i+1);
      var avg=sma[i];
      var std=Math.sqrt(sl.reduce(function(s,v){return s+(v-avg)*(v-avg);},0)/sl.length);
      return{mid:avg,upper:avg+m*std,lower:avg-m*std};
    });
  },
  atr:function(highs,lows,closes,n){
    n=n||14;
    var tr=highs.map(function(h,i){
      if(i===0)return h-lows[i];
      return Math.max(h-lows[i],Math.abs(h-closes[i-1]),Math.abs(lows[i]-closes[i-1]));
    });
    var result=[null];
    var atr0=tr.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
    result.push(atr0);
    for(var i=n;i<tr.length;i++){atr0=(atr0*(n-1)+tr[i])/n;result.push(atr0);}
    return result;
  }
};

// ── SVG CHARTS ─────────────────────────────────────────────────
function svgLine(data,keys,colors,W,H){
  W=W||420;H=H||120;
  if(!data||!data.length)return '<div style="height:'+H+'px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:11px">Sin datos</div>';
  var allVals=[];
  keys.forEach(function(k){data.forEach(function(d){if(d[k]!=null)allVals.push(d[k]);});});
  if(!allVals.length)return "";
  var minV=Math.min.apply(null,allVals)-5;
  var maxV=Math.max.apply(null,allVals)+5;
  var rng=maxV-minV||1;
  var xS=function(i){return (i/(data.length-1))*W;};
  var yS=function(v){return H-((v-minV)/(rng||1))*H;};
  var paths="";
  keys.forEach(function(k,ki){
    var pts=[];
    data.forEach(function(d,i){if(d[k]!=null)pts.push(xS(i).toFixed(1)+","+yS(d[k]).toFixed(1));});
    if(pts.length<2)return;
    var sw=ki===0?2:1.5;
    var da=ki>0?"stroke-dasharray='4 2'":"";
    var op=ki>2?"opacity='0.5'":"";
    paths+="<polyline points='"+pts.join(" ")+"' fill='none' stroke='"+colors[ki]+"' stroke-width='"+sw+"' stroke-linecap='round' stroke-linejoin='round' "+da+" "+op+"/>";
  });
  var grid=[.25,.5,.75].map(function(p){var y=(H*p).toFixed(1);var v=(minV+rng*(1-p)).toFixed(0);return "<line x1='0' y1='"+y+"' x2='"+W+"' y2='"+y+"' stroke='rgba(255,255,255,.04)' stroke-width='1'/><text x='2' y='"+(parseFloat(y)-2)+"' fill='#3d5278' font-size='8' font-family='JetBrains Mono'>$"+v+"</text>";}).join("");
  return "<svg viewBox='0 0 "+W+" "+H+"' style='width:100%;height:"+H+"px'>"+grid+paths+"</svg>";
}

function svgBars(data,key,W,H,zero,refLines){
  W=W||420;H=H||80;zero=zero||0;refLines=refLines||[];
  var vals=data.map(function(d){return d[key];}).filter(function(v){return v!=null;});
  if(!vals.length)return "";
  var allRef=refLines.map(function(r){return r.val;});
  var minV=Math.min.apply(null,vals.concat([zero]).concat(allRef));
  var maxV=Math.max.apply(null,vals.concat([zero]).concat(allRef));
  var rng=maxV-minV||1;
  var bw=W/data.length;
  var bars=data.map(function(d,i){
    if(d[key]==null)return "";
    var pos=d[key]>=zero;
    var bh=Math.abs(d[key]-zero)/rng*H;
    var y=pos?((maxV-d[key])/rng*H):((maxV-zero)/rng*H);
    return "<rect x='"+(i*bw+1).toFixed(1)+"' y='"+y.toFixed(1)+"' width='"+(bw-2).toFixed(1)+"' height='"+bh.toFixed(1)+"' fill='"+(pos?"var(--grn)":"var(--red)")+"' opacity='.8' rx='1'/>";
  }).join("");
  var zy=((maxV-zero)/rng*H).toFixed(1);
  var refSvg=refLines.map(function(r){
    var ry=((maxV-r.val)/rng*H).toFixed(1);
    return "<line x1='0' y1='"+ry+"' x2='"+W+"' y2='"+ry+"' stroke='"+r.color+"' stroke-width='1' stroke-dasharray='4 3'/>";
  }).join("");
  return "<svg viewBox='0 0 "+W+" "+H+"' style='width:100%;height:"+H+"px'><line x1='0' y1='"+zy+"' x2='"+W+"' y2='"+zy+"' stroke='rgba(255,255,255,.1)' stroke-width='1'/>"+refSvg+bars+"</svg>";
}

// ── LIGHTWEIGHT CHARTS (Candlestick) ───────────────────────────
var _lwLoaded=false;
var _lwLoadPromise=null;
var _lwChartMain=null;
var _lwChartVol=null;

function loadLWScript(){
  if(_lwLoaded) return Promise.resolve();
  if(_lwLoadPromise) return _lwLoadPromise;
  _lwLoadPromise=new Promise(function(resolve,reject){
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/lightweight-charts@4/dist/lightweight-charts.standalone.production.js';
    s.onload=function(){_lwLoaded=true;resolve();};
    s.onerror=reject;
    document.head.appendChild(s);
  });
  return _lwLoadPromise;
}

function renderLWCharts(hist,sma20,sma50,bbArr,sma200){
  loadLWScript().then(function(){
    var LW=window.LightweightCharts;
    if(!LW) return;
    var mainEl=document.getElementById('lw-chart-main');
    var volEl=document.getElementById('lw-chart-vol');
    if(!mainEl||!volEl) return;
    if(_lwChartMain){try{_lwChartMain.remove();}catch(e){} _lwChartMain=null;}
    if(_lwChartVol){try{_lwChartVol.remove();}catch(e){} _lwChartVol=null;}
    // Filter valid OHLCV bars
    var bars=hist.filter(function(d){return d.ts&&d.open&&d.high&&d.low&&d.close;});
    if(!bars.length) return;

    var bgColor='#0d0f14';
    var textColor='#8a9bbd';
    var gridColor='rgba(255,255,255,0.04)';

    _lwChartMain=LW.createChart(mainEl,{
      width:mainEl.clientWidth||mainEl.offsetWidth||300,
      height:210,
      layout:{background:{type:'solid',color:bgColor},textColor:textColor,fontFamily:"'JetBrains Mono',monospace",fontSize:9},
      grid:{vertLines:{color:gridColor},horzLines:{color:gridColor}},
      crosshair:{mode:LW.CrosshairMode.Normal},
      timeScale:{timeVisible:false,borderColor:'rgba(255,255,255,0.07)'},
      rightPriceScale:{borderColor:'rgba(255,255,255,0.07)'},
    });
    var chart=_lwChartMain;

    var candleSeries=chart.addCandlestickSeries({
      upColor:'#22c55e',downColor:'#ef4444',wickUpColor:'#22c55e',wickDownColor:'#ef4444',
      borderVisible:false,
    });
    candleSeries.setData(bars.map(function(d){return {time:d.ts,open:d.open,high:d.high,low:d.low,close:d.close};}));

    var s20Data=bars.map(function(d,i){return sma20[i]!=null?{time:d.ts,value:sma20[i]}:null;}).filter(Boolean);
    if(s20Data.length){
      var s20s=chart.addLineSeries({color:'#f59e0b',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
      s20s.setData(s20Data);
    }
    var s50Data=bars.map(function(d,i){return sma50[i]!=null?{time:d.ts,value:sma50[i]}:null;}).filter(Boolean);
    if(s50Data.length){
      var s50s=chart.addLineSeries({color:'#3d8ef8',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
      s50s.setData(s50Data);
    }
    if(sma200&&sma200.length){
      var s200Data=bars.map(function(d,i){return sma200[i]!=null?{time:d.ts,value:sma200[i]}:null;}).filter(Boolean);
      if(s200Data.length){
        var s200s=chart.addLineSeries({color:'#a855f7',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
        s200s.setData(s200Data);
      }
    }
    if(bbArr&&bbArr.length){
      var bbUpData=bars.map(function(d,i){return bbArr[i]&&bbArr[i].upper!=null?{time:d.ts,value:bbArr[i].upper}:null;}).filter(Boolean);
      var bbLoData=bars.map(function(d,i){return bbArr[i]&&bbArr[i].lower!=null?{time:d.ts,value:bbArr[i].lower}:null;}).filter(Boolean);
      if(bbUpData.length){
        var bbUs=chart.addLineSeries({color:'rgba(61,142,248,0.3)',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,lineStyle:2});
        bbUs.setData(bbUpData);
      }
      if(bbLoData.length){
        var bbLs=chart.addLineSeries({color:'rgba(61,142,248,0.3)',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,lineStyle:2});
        bbLs.setData(bbLoData);
      }
    }
    chart.timeScale().fitContent();

    // Volume chart
    _lwChartVol=LW.createChart(volEl,{
      width:volEl.clientWidth||volEl.offsetWidth||300,
      height:60,
      layout:{background:{type:'solid',color:bgColor},textColor:textColor},
      grid:{vertLines:{color:gridColor},horzLines:{color:gridColor}},
      timeScale:{timeVisible:false,borderColor:'rgba(255,255,255,0.07)'},
      rightPriceScale:{borderColor:'rgba(255,255,255,0.07)'},
      crosshair:{mode:LW.CrosshairMode.Hidden},
    });
    var volChart=_lwChartVol;
    var volSeries=volChart.addHistogramSeries({
      color:'rgba(255,255,255,0.15)',priceFormat:{type:'volume'},priceScaleId:'',
    });
    volSeries.setData(bars.map(function(d){return {time:d.ts,value:d.vol||0,color:d.close>=d.open?'rgba(34,197,94,0.3)':'rgba(239,68,68,0.3)'};}));
    volChart.timeScale().fitContent();

    // Sync x-axis scroll between both charts
    chart.timeScale().subscribeVisibleLogicalRangeChange(function(r){if(r)volChart.timeScale().setVisibleLogicalRange(r);});
  }).catch(function(){});
}

function genFallback(basePrice,days){
  var data=[];var p=basePrice*0.88;
  for(var i=0;i<days;i++){
    var chg=(Math.random()-0.48)*p*0.022;
    var c=Math.max(p+chg,1);
    data.push({date:"D"+(i+1),open:p,high:Math.max(p,c)*1.005,low:Math.min(p,c)*0.995,close:c,vol:Math.floor(Math.random()*50e6+10e6),p:i+1,_synthetic:true});
    p=c;
  }
  data[data.length-1].close=basePrice;
  return data;
}

function isNYSEOpen(){
  var now=new Date();
  // NYSE: Mon–Fri 09:30–16:00 ET
  var et=new Date(now.toLocaleString('en-US',{timeZone:'America/New_York'}));
  var d=et.getDay(); // 0=Sun,6=Sat
  if(d===0||d===6) return false;
  var h=et.getHours(),m=et.getMinutes();
  return (h>9||(h===9&&m>=30))&&h<16;
}

  return '<span style="font-size:'+s+'px;color:'+(p>=0?'var(--grn)':'var(--red)')+'"> '+(p>=0?'+':'')+p.toFixed(2)+'%</span>';

function distCell(cur,ref){

// ── TABLE SORTING ────────────────────────────────────────────────
var _tblSort={col:null,asc:true,tbl:null};
function tblSortBy(tbl,col){
  if(_tblSort.tbl===tbl&&_tblSort.col===col){_tblSort.asc=!_tblSort.asc;}
  else{_tblSort.tbl=tbl;_tblSort.col=col;_tblSort.asc=false;}
  var tbody=document.querySelector('#tbl-'+tbl+' tbody');
  if(!tbody) return;
  var rows=Array.from(tbody.querySelectorAll('tr'));
  rows.sort(function(a,b){
    var ca=a.getAttribute('data-'+col)||'';
    var cb=b.getAttribute('data-'+col)||'';
    var na=parseFloat(ca),nb=parseFloat(cb);
    var va=isNaN(na)?ca.toLowerCase():na;
    var vb=isNaN(nb)?cb.toLowerCase():nb;
    if(va<vb) return _tblSort.asc?-1:1;
    if(va>vb) return _tblSort.asc?1:-1;
    return 0;
  });
  rows.forEach(function(r){tbody.appendChild(r);});
  // Update header indicators
  document.querySelectorAll('#tbl-'+tbl+' th[data-sort]').forEach(function(th){
    var arrow=th.getAttribute('data-sort')===col?(_tblSort.asc?' ↑':' ↓'):'';
    th.setAttribute('data-arrow',arrow);
    th.querySelector('.sarrow').textContent=arrow;
  });
}
function sortTh(tbl,col,label){
  return '<th data-sort="'+col+'" onclick="tblSortBy(\''+tbl+'\',\''+col+'\')" style="cursor:pointer;white-space:nowrap">'+label+' <span class="sarrow"></span></th>';
}
function showToast(msg,type){
  var c=document.getElementById('toast-container');

  var t=document.createElement('div');
  t.className='toast '+(type||'success');
  var icon=type==='error'?'✕':type==='warning'?'⚠':type==='info'?'ℹ':'✓';
  var iconEl=document.createElement('span');iconEl.textContent=icon+' ';
  var msgEl=document.createElement('span');msgEl.textContent=msg;
  t.appendChild(iconEl);t.appendChild(msgEl);
  c.appendChild(t);

  setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},300); },3000);
}

var DE_CACHE={regime:null,vix:null,breadth:null,sectorRS:{},scores:{},lastFetch:0};

// VIX — volatility regime layer
async function deGetVIX(){
  if(DE_CACHE.vix&&(Date.now()-DE_CACHE.lastFetch)<1800000)return DE_CACHE.vix;
  try{
    var hist=await fetchHistory('^VIX','3mo');
    if(!hist||!hist.length)throw new Error('no data');
    var v=hist[hist.length-1].close;
    var prev=hist.length>5?hist[hist.length-6].close:v;
    var regime=v<15?'low':v<25?'normal':v<35?'elevated':'crisis';
    var sizing={low:1.0,normal:0.75,elevated:0.50,crisis:0.25}[regime];
    var label={low:'VIX Bajo',normal:'VIX Normal',elevated:'VIX Elevado',crisis:'VIX Crisis'}[regime];
    var color={low:'var(--grn)',normal:'var(--blue)',elevated:'var(--amber)',crisis:'var(--red)'}[regime];
    var emoji={low:'🟢',normal:'🔵',elevated:'🟠',crisis:'🔴'}[regime];
    var tip={low:'Volatilidad baja — entorno de baja incertidumbre histórica.',normal:'Volatilidad normal — nivel dentro del rango histórico promedio.',elevated:'Volatilidad alta — entorno de mayor incertidumbre de mercado.',crisis:'Volatilidad extrema — nivel históricamente muy elevado.'}[regime];
    var result={vix:v,prev:prev,regime:regime,label:label,color:color,emoji:emoji,tip:tip,sizing:sizing};
    DE_CACHE.vix=result;return result;
  }catch(e){return{vix:null,regime:'unknown',label:'VIX N/D',color:'var(--text3)',emoji:'⚪',tip:'No se pudo obtener VIX.',sizing:1.0};}
}

// Market Breadth — % S&P 500 above SMA200 via $SPXA200R
async function deGetBreadth(){
  if(DE_CACHE.breadth&&(Date.now()-DE_CACHE.lastFetch)<1800000)return DE_CACHE.breadth;

    var result={pct:v,prev:prev,regime:regime,label:label,color:color,warning:warning};

async function deGetSectorRS(ticker){
  var etf=SECTOR_MAP[ticker];
  if(!etf)return null;
  if(DE_CACHE.sectorRS[etf]&&(Date.now()-DE_CACHE.lastFetch)<1800000)return DE_CACHE.sectorRS[etf];
  try{
    var [etfH,spyH]=await Promise.all([fetchHistory(etf,'3mo'),fetchHistory('SPY','3mo')]);
    if(!etfH||etfH.length<22||!spyH||spyH.length<22)return null;
    var etfRet=(etfH[etfH.length-1].close-etfH[etfH.length-22].close)/etfH[etfH.length-22].close;
    var spyRet=(spyH[spyH.length-1].close-spyH[spyH.length-22].close)/spyH[spyH.length-22].close;
    var rs=etfRet-spyRet;
    var label=etf+' '+(rs>=0.02?'🔥 outperform':rs>=-0.02?'≈ en línea':'📉 underperform');
    var color=rs>=0.02?'var(--grn)':rs>=-0.02?'var(--text2)':'var(--red)';
    var mult=rs>=0.02?1.2:rs>=-0.02?1.0:0.7;
    var result={etf:etf,rs:rs,label:label,color:color,mult:mult,etfRet:etfRet,spyRet:spyRet};
    DE_CACHE.sectorRS[etf]=result;return result;
  }catch(e){return null;}
}

async function deGetRegime(){
  // Return from cache if < 30 min old
  if(DE_CACHE.regime&&(Date.now()-DE_CACHE.lastFetch)<1800000)return DE_CACHE.regime;
  var hist=await fetchHistory('SPY','1y');
  if(!hist||hist.length<55){return{regime:'neutral',label:'Sin datos',color:'var(--text2)',spy:null,sma200:null};}
  var closes=hist.map(function(d){return d.close;});
  var sma200arr=TI.sma(closes,Math.min(200,closes.length));
  var sma50arr =TI.sma(closes,Math.min(50,closes.length));
  var last=closes[closes.length-1];
  var s200=sma200arr[sma200arr.length-1];
  var s50 =sma50arr[sma50arr.length-1];
  var regime,label,color,emoji,desc;
  var pct200=(last-s200)/s200;
  if(last>s200&&s50>s200&&pct200>0.01){
    regime='risk_on';label='Risk On';color='var(--grn)';emoji='🟢';
    desc='Precio y SMA50 sobre SMA200. Tendencia alcista confirmada.';
  }else if(last<s200&&s50<s200){
    regime='risk_off';label='Risk Off';color='var(--red)';emoji='🔴';
    desc='Precio y SMA50 bajo SMA200. Mercado en tendencia bajista.';
  }else{
    regime='neutral';label='Neutral';color='var(--amber)';emoji='🟡';
    desc='SPY entre SMA50 y SMA200. Zona de transición — mayor cautela.';
  }
  var result={regime:regime,label:label,color:color,emoji:emoji,desc:desc,spy:last,sma200:s200,sma50:s50,pct200:pct200,hist:hist};
  DE_CACHE.regime=result;DE_CACHE.lastFetch=Date.now();
  return result;
}

function drawSPYMiniChart(regime){
  try{
    var canvas=document.getElementById('spy-mini-chart');
    if(!canvas) return;
    var ctx=canvas.getContext('2d');
    var rawHist=regime&&regime.hist;
    // Work on a copy sorted oldest→newest — do not mutate regime.hist
    var hist=rawHist?rawHist.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;}):[];
    var closes=hist.map(function(d){return d.close;});
    var hasSMA200=closes.length>=200;
    // Status label
    var statusEl=document.getElementById('spy-mini-status');
    if(statusEl){
      if(!closes.length){statusEl.textContent='No se pudo cargar el contexto SPY.';}
      else if(!hasSMA200){statusEl.textContent='SMA200 no disponible — datos insuficientes.';}
      else{statusEl.textContent=closes[closes.length-1]>=regime.sma200?'SPY sobre SMA200':'SPY bajo SMA200';}
    }
    if(!hasSMA200||!closes.length) return;
    // Compute full SMA200 array (only real 200-period values — no Math.min shortcut)
    var smaArr=[];
    for(var i=0;i<closes.length;i++){
      if(i<199){smaArr.push(null);}
      else{var sum=0;for(var j=i-199;j<=i;j++) sum+=closes[j];smaArr.push(sum/200);}
    }
    // Size canvas for retina
    var dpr=window.devicePixelRatio||1;
    var W=canvas.offsetWidth||canvas.parentElement.offsetWidth||300;
    var H=76;
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.scale(dpr,dpr);
    // Price range across both series
    var validSma=smaArr.filter(function(v){return v!=null;});
    var allV=closes.concat(validSma);
    var minP=Math.min.apply(null,allV), maxP=Math.max.apply(null,allV);
    var rng=maxP-minP||1;
    function xOf(i){return 1+(W-2)*(i/(closes.length-1));}
    function yOf(v){return H-4-(H-8)*((v-minP)/rng);}
    // SMA200 line
    ctx.beginPath(); ctx.strokeStyle=regime.color||'#f59e0b'; ctx.lineWidth=1.5;
    var firstSma=true;
    smaArr.forEach(function(v,i){
